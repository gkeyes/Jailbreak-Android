# 签名材料的取值文件（私有仓库、单人使用）。
#
# 为什么放仓库里：这把钥匙就是 App 的身份，换钥匙 = 必须卸载重装。
# 与其在 CI/Secrets/本地三处维护同一份东西，不如就放一处，简单可查。
#
# 代价（明确写下来）：能读这个仓库的人就能签出可以覆盖安装到你手机上的包。
# 如果哪天仓库要公开、或者要多个人协作，先把这几行搬到 Secrets，再删掉本文件。
#
# jks 本身不在工作树里（已移出），CI 用 `git show <提交>:keystore/lhasa26.jks` 恢复；
# 本地构建把它放回 keystore/lhasa26.jks 即可。

storeFile=keystore/lhasa26.jks
storePassword=lhasa26pass
keyAlias=lhasa26
keyPassword=lhasa26pass
