name: ping

# 最小探针：确认本分支上新增的工作流到底会不会被触发。
# 只要能出现 plant/ping.md 与 ping-* tag，就说明机制正常，之前的沉默来自具体文件。

on:
  push:
    branches: [ fix/p0-clean-boot-retry ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -e
          mkdir -p plant
          printf 'ping %s\n' "${GITHUB_SHA}" > plant/ping.md
          git config user.name "lhasa-ci"
          git config user.email "lhasa-ci@users.noreply.github.com"
          git add plant/ping.md
          git commit -m "ci: ping ${GITHUB_SHA:0:8} [ping]" || true
          git push || true
          git tag -f "ping-${GITHUB_SHA:0:8}"
          git push origin "refs/tags/ping-${GITHUB_SHA:0:8}" --force || true
