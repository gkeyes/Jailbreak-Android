name: build-apk

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'design/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradlew'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

env:
  LHASA_SIGNING_CERT_SHA256: 'c8a20a023c2ed36ae144327f7f254ff082b965806b4388fc5c55809be81bb7cc'
  KSUSD_SHA256: 4f7d5fd65631915ea579ff406bd9cbe58217f2c91dac6527f5b2f28ad4508171
  KSU_APK_SHA256: b4a059ace71de2fa65cc7f12b1c58d55fc23ab25e057ee4230ce779742abe450

jobs:
  app:
    if: "github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (!contains(github.event.head_commit.message, 'ci: signed apk ok') && !contains(github.event.head_commit.message, 'ci: build failed'))"
    runs-on: ubuntu-latest
    env:
      LHASA_STORE_PASSWORD: ${{ secrets.LHASA_STORE_PASSWORD }}
      LHASA_KEY_ALIAS: ${{ secrets.LHASA_KEY_ALIAS }}
      LHASA_KEY_PASSWORD: ${{ secrets.LHASA_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Drop legacy tag noise
        run: |
          set +e
          git ls-remote --tags origin \
            | awk '{print $2}' \
            | grep -v '\^{}' \
            | grep -E '^refs/tags/(apk-|design-ok-|fail-)' \
            | while read -r ref; do
                echo "removing $ref"
                git push origin ":$ref"
              done

      - name: Verify or repair the ksud asset
        run: |
          actual=$(sha256sum app/src/main/assets/ksud | awk '{print $1}')
          if [ "$actual" = "$KSUSD_SHA256" ]; then
            echo "ksud ok" > ci.log
            exit 0
          fi
          curl -fsSL -o /tmp/ksu-manager.apk \
            https://github.com/tiann/KernelSU/releases/download/v3.3.1/KernelSU_v3.3.1_32680-release.apk
          echo "$KSU_APK_SHA256  /tmp/ksu-manager.apk" | sha256sum -c - >> ci.log
          unzip -p /tmp/ksu-manager.apk lib/arm64-v8a/libksud.so > /tmp/libksud.so
          echo "$KSUSD_SHA256  /tmp/libksud.so" | sha256sum -c - >> ci.log
          cp /tmp/libksud.so app/src/main/assets/ksud
          git config user.name "lhasa-ci"
          git config user.email "lhasa-ci@users.noreply.github.com"
          git add -f app/src/main/assets/ksud
          git commit -m "ci: restore truncated ksud asset (sha256=$KSUSD_SHA256)"
          git push



      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore and verify the fixed release signing key
        shell: bash
        env:
          LHASA_KEYSTORE_B64: ${{ secrets.LHASA_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          for name in LHASA_KEYSTORE_B64 LHASA_STORE_PASSWORD LHASA_KEY_ALIAS LHASA_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required Actions secret $name is missing"
              exit 1
            fi
          done
          umask 077
          signing_dir="$RUNNER_TEMP/lhasa26-signing"
          mkdir -p "$signing_dir"
          keystore="$signing_dir/release.jks"
          certificate="$signing_dir/certificate.der"
          if ! printf '%s' "$LHASA_KEYSTORE_B64" | base64 --decode > "$keystore"; then
            echo "::error::LHASA_KEYSTORE_B64 is not valid base64"
            exit 1
          fi
          if [ ! -s "$keystore" ]; then
            echo "::error::The configured release keystore is empty"
            exit 1
          fi
          if ! keytool -exportcert -keystore "$keystore" -alias "$LHASA_KEY_ALIAS" \
            -storepass:env LHASA_STORE_PASSWORD -file "$certificate" > /dev/null 2>&1; then
            echo "::error::The configured keystore, store password or key alias is invalid"
            exit 1
          fi
          actual=$(sha256sum "$certificate" | awk '{print $1}')
          if [ "$actual" != "$LHASA_SIGNING_CERT_SHA256" ]; then
            echo "::error::The signing certificate does not match the fixed release identity"
            exit 1
          fi
          echo "LHASA_KEYSTORE=$keystore" >> "$GITHUB_ENV"
          echo "Release signing certificate verified"

      - name: Prepare SDK
        run: |
          set +e
          for root in "${ANDROID_SDK_ROOT:-}" /usr/local/lib/android/sdk /opt/android-sdk; do
            if [ -n "$root" ] && [ -d "$root/platforms" ]; then
              echo "ANDROID_SDK_ROOT=$root" >> "$GITHUB_ENV"
              if [ -x "$root/cmdline-tools/latest/bin/sdkmanager" ]; then
                yes | "$root/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1
              fi
              break
            fi
          done

      - name: Gradle build
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon :app:assembleRelease 2>&1 | tee -a ci.log

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          apk=$(ls app/build/outputs/apk/release/*.apk | head -1)
          unzip -p "$apk" assets/ksud > /tmp/apk-ksud
          echo "$KSUSD_SHA256  /tmp/apk-ksud" | sha256sum -c - >> ci.log
          size=$(stat -c%s "$apk")
          apksigner=$(ls "$ANDROID_SDK_ROOT"/build-tools/*/apksigner 2>/dev/null | tail -1 || true)
          if [ -z "$apksigner" ]; then
            echo "::error::Cannot find apksigner"
            exit 1
          fi
          if ! "$apksigner" verify --print-certs "$apk" > /tmp/certs.txt 2>&1; then
            echo "::error::APK signature verification failed"
            cat /tmp/certs.txt
            exit 1
          fi
          cat /tmp/certs.txt >> ci.log
          cert=$(sed -n 's/^Signer #[0-9][0-9]* certificate SHA-256 digest: //p' /tmp/certs.txt | tr '[:upper:]' '[:lower:]' | tr -d ':')
          if [ "$cert" != "$LHASA_SIGNING_CERT_SHA256" ]; then
            echo "::error::The APK signer does not match the fixed release identity"
            exit 1
          fi
          echo "APK $size bytes; fixed release signer verified"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lhasa26-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # Releases are published only on explicit request: the commit message must contain [release].
      - name: Publish release (explicit only)
        if: success() && contains(github.event.head_commit.message, '[release]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          ver=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -1)
          apk=$(ls app/build/outputs/apk/release/*.apk | head -1)
          sha=$(sha256sum "$apk" | awk '{print $1}')
          size=$(stat -c%s "$apk")
          cert=$(grep -m1 'SHA-256 digest' /tmp/certs.txt 2>/dev/null | awk '{print $NF}' | cut -c1-16)
          tag="v${ver}"
          asset="/tmp/lhasa26-${ver}.apk"
          cp "$apk" "$asset"
          notes=$(printf '## 18fold越狱 %s\n\n- size: %s bytes\n- sha256: `%s`\n- signer: `%s`\n- ksud: `%s`\n- main `%s`\n' \
            "$ver" "$size" "$sha" "${cert:-unknown}" "$KSUSD_SHA256" "${GITHUB_SHA:0:8}")
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$asset" --clobber
          else
            gh release create "$tag" "$asset" --title "18fold越狱 ${ver}" --notes "$notes" --target "$GITHUB_SHA"
          fi

      - name: Report failure as an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tail -c 20000 ci.log > /tmp/fail.log 2>/dev/null || true
          { echo "Commit: \`${GITHUB_SHA:0:8}\`"; echo; echo '```text'; cat /tmp/fail.log; echo '```'; } > /tmp/fail.md
          gh issue create --title "build failed ${GITHUB_SHA:0:8}" --body-file /tmp/fail.md

      # One rolling tag carries the last build result, so the tag list never grows.
      - name: Update build-state tag
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          set +e
          git config user.name "lhasa-ci"
          git config user.email "lhasa-ci@users.noreply.github.com"
          git ls-remote --tags origin | awk '{print $2}' | grep -v '\^{}' \
            | grep -E '^refs/tags/build-state-' \
            | while read -r ref; do git push origin ":$ref"; done

          ver=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -1)
          apk=$(ls app/build/outputs/apk/release/*.apk 2>/dev/null | head -1)
          if [ "$RESULT" = "success" ] && [ -n "$apk" ]; then
            sha=$(sha256sum "$apk" | awk '{print $1}')
            size=$(stat -c%s "$apk")
            cert=$(grep -m1 'SHA-256 digest' /tmp/certs.txt 2>/dev/null | awk '{print $NF}' | cut -c1-12)
            tag="build-state-ok-${ver}-$(echo "$sha" | cut -c1-12)-s${size}-c${cert:-none}"
          else
            tag="build-state-fail-${ver}-run${GITHUB_RUN_NUMBER}"
          fi
          git tag -f "$tag"
          git push origin "refs/tags/$tag" --force

      - name: Remove temporary signing files
        if: always()
        shell: bash
        run: |
          rm -f -- "$RUNNER_TEMP/lhasa26-signing/release.jks" \
            "$RUNNER_TEMP/lhasa26-signing/certificate.der"
          rmdir -- "$RUNNER_TEMP/lhasa26-signing" 2>/dev/null || true

  design:
    if: "!contains(github.event.head_commit.message, 'ci: signed apk ok') && !contains(github.event.head_commit.message, 'ci: build failed')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare SDK
        run: |
          set +e
          for root in "${ANDROID_SDK_ROOT:-}" /usr/local/lib/android/sdk /opt/android-sdk; do
            if [ -n "$root" ] && [ -d "$root" ]; then
              echo "ANDROID_SDK_ROOT=$root" >> "$GITHUB_ENV"
              if [ -x "$root/cmdline-tools/latest/bin/sdkmanager" ]; then
                yes | "$root/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1
              fi
              break
            fi
          done

      - name: Build the console library
        run: |
          set -o pipefail
          cd design/miuix-console
          chmod +x gradlew
          ./gradlew --no-daemon :ui:assembleRelease 2>&1 | tee design.log

      - name: Update design-state tag
        if: success()
        run: |
          set +e
          git config user.name "lhasa-ci"
          git config user.email "lhasa-ci@users.noreply.github.com"
          git ls-remote --tags origin | awk '{print $2}' | grep -v '\^{}' \
            | grep -E '^refs/tags/design-state-' \
            | while read -r ref; do git push origin ":$ref"; done
          tag="design-state-ok-${GITHUB_SHA:0:8}"
          git tag -f "$tag"
          git push origin "refs/tags/$tag" --force

      - name: Report console failure as an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tail -c 20000 design/miuix-console/design.log > /tmp/dfail.log 2>/dev/null || true
          { echo "Console library build, commit \`${GITHUB_SHA:0:8}\`"; echo; echo '```text'; cat /tmp/dfail.log; echo '```'; } > /tmp/dfail.md
          gh issue create --title "design-build failed ${GITHUB_SHA:0:8}" --body-file /tmp/dfail.md


