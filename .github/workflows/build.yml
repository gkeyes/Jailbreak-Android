name: build-apk

on:
  push:
    branches: [ main, fix/android-safety-and-logs ]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradlew'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  LHASA_STORE_PASSWORD: lhasa26pass
  LHASA_KEY_ALIAS: lhasa26
  LHASA_KEY_PASSWORD: lhasa26pass

jobs:
  build:
    # Skip the bookkeeping commit this workflow pushes on success.
    if: "!contains(github.event.head_commit.message, 'ci: signed apk ok')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure fixed signing key
        run: |
          set -e
          if [ ! -f keystore/lhasa26.jks ]; then
            mkdir -p keystore
            keytool -genkeypair -v \
              -keystore keystore/lhasa26.jks \
              -alias "$LHASA_KEY_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$LHASA_STORE_PASSWORD" \
              -keypass "$LHASA_KEY_PASSWORD" \
              -dname "CN=Lhasa26-Android, OU=local, O=local, C=CN"
            git config user.name "lhasa-ci"
            git config user.email "lhasa-ci@users.noreply.github.com"
            # .gitignore excludes *.jks, so force-add the one fixed key.
            git add -f keystore/lhasa26.jks
            git commit -m "ci: add fixed release signing key"
            git push
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Gradle build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lhasa26-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Record build
        run: |
          set -e
          sha=$(sha256sum app/build/outputs/apk/release/*.apk | awk '{print $1}')
          git config user.name "lhasa-ci"
          git config user.email "lhasa-ci@users.noreply.github.com"
          git commit --allow-empty -m "ci: signed apk ok sha256=$sha"
          git push
