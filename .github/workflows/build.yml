name: build-apk

on:
  push:
    branches: [ main, fix/android-safety-and-logs ]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradlew'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  LHASA_STORE_PASSWORD: lhasa26pass
  LHASA_KEY_ALIAS: lhasa26
  LHASA_KEY_PASSWORD: lhasa26pass

jobs:
  build:
    if: "!contains(github.event.head_commit.message, 'ci: signed apk ok') && !contains(github.event.head_commit.message, 'ci: build failed')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Marker A (checkout)
        run: |
          echo "A: checkout ok $(date -u +%H:%M:%S)" > ci.log
          ls -1 | head -20 >> ci.log

      - name: Ensure fixed signing key
        run: |
          set -e
          if [ ! -f keystore/lhasa26.jks ]; then
            mkdir -p keystore
            keytool -genkeypair -v \
              -keystore keystore/lhasa26.jks \
              -alias "$LHASA_KEY_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$LHASA_STORE_PASSWORD" \
              -keypass "$LHASA_KEY_PASSWORD" \
              -dname "CN=Lhasa26-Android, OU=local, O=local, C=CN" >> ci.log 2>&1
            git config user.name "lhasa-ci"
            git config user.email "lhasa-ci@users.noreply.github.com"
            git add -f keystore/lhasa26.jks
            git commit -m "ci: add fixed release signing key"
            git push
          fi
          echo "B: keystore ready" >> ci.log

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Marker C (java + sdk)
        run: |
          set +e
          { echo "C: java $(java -version 2>&1 | head -1)"; } >> ci.log
          for root in "${ANDROID_SDK_ROOT:-}" /usr/local/lib/android/sdk /opt/android-sdk; do
            if [ -n "$root" ] && [ -d "$root/platforms" ]; then
              echo "C: sdk=$root platforms=$(ls "$root/platforms" | tr '\n' ' ')" >> ci.log
              echo "ANDROID_SDK_ROOT=$root" >> "$GITHUB_ENV"
              break
            fi
          done
          echo "C: done" >> ci.log

      - name: Gradle build
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon :app:assembleRelease 2>&1 | tee -a ci.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lhasa26-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Record build
        if: success()
        run: |
          set -e
          sha=$(sha256sum app/build/outputs/apk/release/*.apk | awk '{print $1}')
          git config user.name "lhasa-ci"
          git config user.email "lhasa-ci@users.noreply.github.com"
          git commit --allow-empty -m "ci: signed apk ok sha256=$sha"
          git push

      - name: Record failure
        if: failure()
        run: |
          git config user.name "lhasa-ci"
          git config user.email "lhasa-ci@users.noreply.github.com"
          excerpt=$(tail -c 600 ci.log 2>/dev/null | tr '\n' ' ' | tr -s ' ' | cut -c1-400)
          git commit --allow-empty -m "ci: build failed :: ${excerpt:-no-log}"
          git push
