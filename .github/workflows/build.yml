name: build-apk

# next 的发布构建。只做两件事：构建、按需发布。
#
# 签名策略（简单版）：
#   - 钥匙就一把：keystore/lhasa26.jks，它在历史里，工作树里不常驻；
#   - 口令在 keystore/keystore.properties（私有仓库，单人使用）；
#   - 不依赖任何 Actions Secrets。想以后搬去 Secrets 时，代码不用改，
#     只要设了同名环境变量就会优先用环境变量。
#
# 其它与前几轮保持一致：只读为主，review 之外的写操作只有发布 job 和 tag。

on:
  push:
    branches: [ next ]
    paths:
      - 'app/**'
      - 'design/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradlew'
      - 'tools/**'
      - 'keystore/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # 需要历史才能把 jks 从旧提交里取回来
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare SDK
        run: |
          set +e
          for root in "${ANDROID_SDK_ROOT:-}" /usr/local/lib/android/sdk /opt/android-sdk; do
            if [ -n "$root" ] && [ -d "$root/platforms" ]; then
              echo "ANDROID_SDK_ROOT=$root" >> "$GITHUB_ENV"
              if [ -x "$root/cmdline-tools/latest/bin/sdkmanager" ]; then
                yes | "$root/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1
              fi
              break
            fi
          done

      - name: 资产台账
        run: python3 tools/check_assets.py --strict

      - name: 校验 ksud（不匹配即失败，不再自动覆盖）
        run: bash tools/fetch_ksud.sh

      - name: 恢复签名钥匙
        run: |
          set -e
          if [ -f keystore/lhasa26.jks ]; then
            echo "工作树里已有 keystore"
          else
            echo "从历史恢复 keystore/lhasa26.jks"
            git show 535ee09ab2aa2c9bd8cc6e76b2159f6c4e1cef4e:keystore/lhasa26.jks > keystore/lhasa26.jks
          fi
          ls -l keystore/lhasa26.jks keystore/keystore.properties

      - name: Gradle build
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon :app:assembleRelease 2>&1 | tee build.log

      - name: 校验 APK
        run: |
          set -e
          apk=$(ls app/build/outputs/apk/release/*.apk | head -1)
          want=$(sed -n 's/^sha256=//p' tools/ksud.lock.properties)
          unzip -p "$apk" "assets/ksud" > /tmp/apk-ksud
          actual=$(sha256sum /tmp/apk-ksud | awk '{print $1}')
          if [ "$actual" != "$want" ]; then
            echo "::error::APK 里的 assets/ksud 与锁文件不符：$actual != $want"
            exit 1
          fi

          apksigner=$(ls "$ANDROID_SDK_ROOT"/build-tools/*/apksigner 2>/dev/null | tail -1)
          if [ -z "$apksigner" ]; then
            echo "::error::找不到 apksigner，无法校验签名"
            exit 1
          fi
          "$apksigner" verify --print-certs "$apk" > /tmp/certs.txt 2>&1 || {
            echo "::error::APK 签名无效"
            cat /tmp/certs.txt
            exit 1
          }
          cat /tmp/certs.txt

          size=$(stat -c%s "$apk")
          sha=$(sha256sum "$apk" | awk '{print $1}')
          cert=$(grep -m1 'SHA-256 digest' /tmp/certs.txt | awk '{print $NF}')
          {
            echo "APK $size bytes"
            echo "sha256: \`$sha\`"
            echo "signer: \`${cert}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        if: success()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: lhasa26-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload build log
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 2

  release:
    needs: build
    if: contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            app/build.gradle.kts
            tools/ksud.lock.properties

      - uses: actions/download-artifact@v4
        with:
          name: lhasa26-release-apk
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          apk=$(ls dist/*.apk | head -1)
          ver=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -1)
          sha=$(sha256sum "$apk" | awk '{print $1}')
          size=$(stat -c%s "$apk")
          tag="v${ver}"
          asset="dist/lhasa26-${ver}.apk"
          cp "$apk" "$asset"
          ksud=$(sed -n 's/^sha256=//p' tools/ksud.lock.properties)
          notes=$(printf '## 18fold越狱 %s\n\n- size: %s bytes\n- sha256: `%s`\n- ksud: `%s`\n- commit: `%s`\n' \
            "$ver" "$size" "$sha" "$ksud" "${GITHUB_SHA:0:8}")
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$asset" --clobber
          else
            gh release create "$tag" "$asset" --title "18fold越狱 ${ver}" --notes "$notes" --target "$GITHUB_SHA"
          fi
