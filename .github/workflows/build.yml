name: build-apk

# 发布构建：测试 → 签名 APK → 按需发布。
#
# 省额度策略（重要）：
#   1. job 级 if 门禁 —— 只有提交信息含 [release]/[apk]，或手动触发，才真正执行。
#      被跳过的 job 不计费，所以普通 push 只留一条"skipped"记录，不烧分钟。
#   2. concurrency —— 同一分支后跑的取消前跑的。
#   3. Gradle 缓存 —— 依赖与增量编译目录复用，构建时间大约减半。
#
# 签名：同一把原签名钥匙仅从 Actions Secrets 恢复到 RUNNER_TEMP。
# 缺失或无效时立即失败；证书与最终 APK 均校验固定公钥指纹。

on:
  push:
    branches: [ next ]
    paths:
      - 'app/**'
      - 'design/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradlew'
      - 'tools/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  LHASA_SIGNING_CERT_SHA256: '3317c15bb094220efb3c61efeb88b7443b3acbe76fcb98566c940ae0a961aa89'

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]') || contains(github.event.head_commit.message, '[apk]')
    permissions:
      contents: read
      issues: write
    env:
      LHASA_STORE_PASSWORD: ${{ secrets.LHASA_STORE_PASSWORD }}
      LHASA_KEY_ALIAS: ${{ secrets.LHASA_KEY_ALIAS }}
      LHASA_KEY_PASSWORD: ${{ secrets.LHASA_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare SDK
        run: |
          set +e
          for root in "${ANDROID_SDK_ROOT:-}" /usr/local/lib/android/sdk /opt/android-sdk; do
            if [ -n "$root" ] && [ -d "$root/platforms" ]; then
              echo "ANDROID_SDK_ROOT=$root" >> "$GITHUB_ENV"
              if [ -x "$root/cmdline-tools/latest/bin/sdkmanager" ]; then
                yes | "$root/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1
              fi
              break
            fi
          done

      - name: Gradle 缓存
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-signing-v2-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-signing-v2-${{ runner.os }}-

      - name: 资产台账
        run: python3 tools/check_assets.py --strict

      - name: 校验 ksud
        run: bash tools/fetch_ksud.sh

      - name: Restore and verify the fixed release signing key
        shell: bash
        env:
          LHASA_KEYSTORE_B64: ${{ secrets.LHASA_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          for name in LHASA_KEYSTORE_B64 LHASA_STORE_PASSWORD LHASA_KEY_ALIAS LHASA_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required Actions secret $name is missing"
              exit 1
            fi
          done
          umask 077
          signing_dir="$RUNNER_TEMP/lhasa26-signing"
          mkdir -p "$signing_dir"
          keystore="$signing_dir/release.jks"
          certificate="$signing_dir/certificate.der"
          if ! printf '%s' "$LHASA_KEYSTORE_B64" | base64 --decode > "$keystore"; then
            echo "::error::LHASA_KEYSTORE_B64 is not valid base64"
            exit 1
          fi
          if [ ! -s "$keystore" ]; then
            echo "::error::The configured release keystore is empty"
            exit 1
          fi
          if ! keytool -exportcert -keystore "$keystore" -alias "$LHASA_KEY_ALIAS" \
            -storepass:env LHASA_STORE_PASSWORD -file "$certificate" > /dev/null 2>&1; then
            echo "::error::The configured keystore, store password or key alias is invalid"
            exit 1
          fi
          actual=$(sha256sum "$certificate" | awk '{print $1}')
          if [ "$actual" != "$LHASA_SIGNING_CERT_SHA256" ]; then
            echo "::error::The signing certificate does not match the fixed release identity"
            exit 1
          fi
          echo "LHASA_KEYSTORE=$keystore" >> "$GITHUB_ENV"
          echo "Release signing certificate verified"

      - name: 单元测试（发布前置门）
        id: tests
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon :app:testDebugUnitTest 2>&1 | tee "$RUNNER_TEMP/test.log" | tail -30

      - name: Gradle build
        id: assemble
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon :app:assembleRelease 2>&1 | tee build.log

      - name: 校验 APK
        run: |
          set -e
          apk=$(ls app/build/outputs/apk/release/*.apk | head -1)
          want=$(sed -n 's/^sha256=//p' tools/ksud.lock.properties)
          unzip -p "$apk" "assets/ksud" > /tmp/apk-ksud
          actual=$(sha256sum /tmp/apk-ksud | awk '{print $1}')
          if [ "$actual" != "$want" ]; then
            echo "::error::APK 里的 assets/ksud 与锁文件不符：$actual != $want"
            exit 1
          fi

          apksigner=$(ls "$ANDROID_SDK_ROOT"/build-tools/*/apksigner 2>/dev/null | tail -1)
          if [ -z "$apksigner" ]; then
            echo "::error::找不到 apksigner"
            exit 1
          fi
          "$apksigner" verify --print-certs "$apk" > /tmp/certs.txt 2>&1 || {
            echo "::error::APK 签名无效"
            cat /tmp/certs.txt
            exit 1
          }
          cat /tmp/certs.txt
          cert=$(sed -n 's/^Signer #[0-9][0-9]* certificate SHA-256 digest: //p' /tmp/certs.txt | tr '[:upper:]' '[:lower:]' | tr -d ':')
          if [ "$cert" != "$LHASA_SIGNING_CERT_SHA256" ]; then
            echo "::error::The APK signer does not match the fixed release identity"
            exit 1
          fi

          size=$(stat -c%s "$apk")
          sha=$(sha256sum "$apk" | awk '{print $1}')
          {
            echo "APK $size bytes"
            echo "sha256: \`$sha\`"
            echo "signer: \`${cert}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        if: success() && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[apk]'))
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: lhasa26-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: 失败时把日志写进 issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          OUT_TESTS: ${{ steps.tests.outcome }}
          OUT_ASSEMBLE: ${{ steps.assemble.outcome }}
        run: |
          set -uo pipefail
          body="$RUNNER_TEMP/ci-failure.md"
          {
            echo "commit: \`$GITHUB_SHA\`"
            echo
            echo '```text'
            echo "tests    = ${OUT_TESTS}"
            echo "assemble = ${OUT_ASSEMBLE}"
            echo '```'
            echo '```text'
            grep -nE '(^e: |error:|FAILURE:|Caused by:|What went wrong|> Task .* FAILED|BUILD FAILED)' \
              "$RUNNER_TEMP/test.log" build.log 2>/dev/null | head -60 || echo "（没有匹配的报错行）"
            echo '```'
            echo '```text'
            tail -c 8000 "$RUNNER_TEMP/test.log" 2>/dev/null || true
            tail -c 8000 build.log 2>/dev/null || true
            echo '```'
          } > "$body"
          gh issue create --title "ci: build 失败 ${GITHUB_SHA:0:8}" --body-file "$body" \
            --repo "${{ github.repository }}" || true

      - name: Remove temporary signing files
        if: always()
        shell: bash
        run: |
          rm -f -- "$RUNNER_TEMP/lhasa26-signing/release.jks" \
            "$RUNNER_TEMP/lhasa26-signing/certificate.der"
          rmdir -- "$RUNNER_TEMP/lhasa26-signing" 2>/dev/null || true

  release:
    needs: build
    if: contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      LHASA_STORE_PASSWORD: ${{ secrets.LHASA_STORE_PASSWORD }}
      LHASA_KEY_ALIAS: ${{ secrets.LHASA_KEY_ALIAS }}
      LHASA_KEY_PASSWORD: ${{ secrets.LHASA_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare SDK
        run: |
          set +e
          for root in "${ANDROID_SDK_ROOT:-}" /usr/local/lib/android/sdk /opt/android-sdk; do
            if [ -n "$root" ] && [ -d "$root/platforms" ]; then
              echo "ANDROID_SDK_ROOT=$root" >> "$GITHUB_ENV"
              break
            fi
          done

      - name: Gradle 缓存
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-signing-v2-release-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-signing-v2-${{ runner.os }}-

      - name: Restore and verify the fixed release signing key
        shell: bash
        env:
          LHASA_KEYSTORE_B64: ${{ secrets.LHASA_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          for name in LHASA_KEYSTORE_B64 LHASA_STORE_PASSWORD LHASA_KEY_ALIAS LHASA_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required Actions secret $name is missing"
              exit 1
            fi
          done
          umask 077
          signing_dir="$RUNNER_TEMP/lhasa26-signing"
          mkdir -p "$signing_dir"
          keystore="$signing_dir/release.jks"
          certificate="$signing_dir/certificate.der"
          if ! printf '%s' "$LHASA_KEYSTORE_B64" | base64 --decode > "$keystore"; then
            echo "::error::LHASA_KEYSTORE_B64 is not valid base64"
            exit 1
          fi
          if [ ! -s "$keystore" ]; then
            echo "::error::The configured release keystore is empty"
            exit 1
          fi
          if ! keytool -exportcert -keystore "$keystore" -alias "$LHASA_KEY_ALIAS" \
            -storepass:env LHASA_STORE_PASSWORD -file "$certificate" > /dev/null 2>&1; then
            echo "::error::The configured keystore, store password or key alias is invalid"
            exit 1
          fi
          actual=$(sha256sum "$certificate" | awk '{print $1}')
          if [ "$actual" != "$LHASA_SIGNING_CERT_SHA256" ]; then
            echo "::error::The signing certificate does not match the fixed release identity"
            exit 1
          fi
          echo "LHASA_KEYSTORE=$keystore" >> "$GITHUB_ENV"
          echo "Release signing certificate verified"

      - name: 测试并构建
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease 2>&1 | tail -40

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          apk=$(ls app/build/outputs/apk/release/*.apk | head -1)
          ver=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -1)
          sha=$(sha256sum "$apk" | awk '{print $1}')
          size=$(stat -c%s "$apk")
          ksud=$(sed -n 's/^sha256=//p' tools/ksud.lock.properties)
          apksigner=$(ls "$ANDROID_SDK_ROOT"/build-tools/*/apksigner 2>/dev/null | tail -1 || true)
          if [ -z "$apksigner" ]; then
            echo "::error::Cannot find apksigner"
            exit 1
          fi
          if ! "$apksigner" verify --print-certs "$apk" > /tmp/certs.txt 2>&1; then
            echo "::error::APK signature verification failed"
            cat /tmp/certs.txt
            exit 1
          fi
          cert=$(sed -n 's/^Signer #[0-9][0-9]* certificate SHA-256 digest: //p' /tmp/certs.txt | tr '[:upper:]' '[:lower:]' | tr -d ':')
          if [ "$cert" != "$LHASA_SIGNING_CERT_SHA256" ]; then
            echo "::error::The APK signer does not match the fixed release identity"
            exit 1
          fi

          tag="v${ver}"
          asset="/tmp/lhasa26-${ver}.apk"
          cp "$apk" "$asset"

          assets_note=$(python3 - <<'PY'
          import json, pathlib
          ledger = json.loads(pathlib.Path("tools/assets-ledger.json").read_text(encoding="utf-8"))
          lines = []
          for entry in ledger["assets"]:
              if not entry.get("inApk"):
                  continue
              lines.append("- `%s` %s 字节 · %s%s" % (
                  entry["name"],
                  entry.get("size", "?"),
                  entry.get("status", "?"),
                  (" · 源码 " + entry["sourceDraft"]) if entry.get("sourceDraft") else "",
              ))
          print("\n".join(lines))
          PY
          )

          notes=$(printf '## 18fold越狱 %s\n\n- size: %s bytes\n- sha256: `%s`\n- signer: `%s`\n- ksud: `%s`\n- commit: `%s`\n\n### APK 内的原生件\n%s\n' \
            "$ver" "$size" "$sha" "${cert:-unknown}" "$ksud" "${GITHUB_SHA:0:8}" "$assets_note")

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$asset" --clobber
            gh release edit "$tag" --notes "$notes"
          else
            gh release create "$tag" "$asset" --title "18fold越狱 ${ver}" --notes "$notes" --target "$GITHUB_SHA"
          fi

      - name: 同步 tag 指向本次构建提交
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          ver=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -1)
          tag="v${ver}"
          if gh api -X PATCH "repos/${{ github.repository }}/git/refs/tags/${tag}" \
               -f sha="$GITHUB_SHA" -F force=true > /tmp/tag.json 2>&1; then
            echo "tag ${tag} → ${GITHUB_SHA}"
          else
            echo "::warning::tag ${tag} 同步失败（不影响本次发布）"
            cat /tmp/tag.json || true
          fi

      - name: Remove temporary signing files
        if: always()
        shell: bash
        run: |
          rm -f -- "$RUNNER_TEMP/lhasa26-signing/release.jks" \
            "$RUNNER_TEMP/lhasa26-signing/certificate.der"
          rmdir -- "$RUNNER_TEMP/lhasa26-signing" 2>/dev/null || true

