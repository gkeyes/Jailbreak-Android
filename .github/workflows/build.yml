name: build-apk

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradlew'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  LHASA_STORE_PASSWORD: lhasa26pass
  LHASA_KEY_ALIAS: lhasa26
  LHASA_KEY_PASSWORD: lhasa26pass
  KSUSD_SHA256: 4f7d5fd65631915ea579ff406bd9cbe58217f2c91dac6527f5b2f28ad4508171
  KSU_APK_SHA256: b4a059ace71de2fa65cc7f12b1c58d55fc23ab25e057ee4230ce779742abe450

jobs:
  build:
    if: "!contains(github.event.head_commit.message, 'ci: signed apk ok') && !contains(github.event.head_commit.message, 'ci: build failed')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Drop stale ci branches
        run: |
          set +e
          echo "A: checkout $(date -u +%H:%M:%S)" > ci.log
          for ref in $(git ls-remote --heads origin 'refs/heads/ci/verify-*' | awk '{print $2}'); do
            branch=${ref#refs/heads/}
            echo "A: deleting stale branch $branch" | tee -a ci.log
            git push origin --delete "$branch"
          done

      - name: Verify or repair the ksud asset
        run: |
          actual=$(sha256sum app/src/main/assets/ksud | awk '{print $1}')
          if [ "$actual" = "$KSUSD_SHA256" ]; then
            echo "B: ksud ok ($actual)" >> ci.log
            exit 0
          fi
          echo "B: ksud mismatch actual=$actual, restoring from KernelSU v3.3.1" >> ci.log
          curl -fsSL -o /tmp/ksu-manager.apk \
            https://github.com/tiann/KernelSU/releases/download/v3.3.1/KernelSU_v3.3.1_32680-release.apk
          echo "$KSU_APK_SHA256  /tmp/ksu-manager.apk" | sha256sum -c - >> ci.log
          unzip -p /tmp/ksu-manager.apk lib/arm64-v8a/libksud.so > /tmp/libksud.so
          echo "$KSUSD_SHA256  /tmp/libksud.so" | sha256sum -c - >> ci.log
          cp /tmp/libksud.so app/src/main/assets/ksud
          git config user.name "lhasa-ci"
          git config user.email "lhasa-ci@users.noreply.github.com"
          git add -f app/src/main/assets/ksud
          git commit -m "ci: restore truncated ksud asset (sha256=$KSUSD_SHA256)"
          git push

      - name: Ensure fixed signing key
        run: |
          set -e
          if [ ! -f keystore/lhasa26.jks ]; then
            mkdir -p keystore
            keytool -genkeypair -v \
              -keystore keystore/lhasa26.jks \
              -alias "$LHASA_KEY_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$LHASA_STORE_PASSWORD" \
              -keypass "$LHASA_KEY_PASSWORD" \
              -dname "CN=Lhasa26-Android, OU=local, O=local, C=CN" >> ci.log 2>&1
            git config user.name "lhasa-ci"
            git config user.email "lhasa-ci@users.noreply.github.com"
            git add -f keystore/lhasa26.jks
            git commit -m "ci: add fixed release signing key"
            git push
          fi
          echo "C: keystore ready" >> ci.log

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare SDK
        run: |
          set +e
          echo "D: java $(java -version 2>&1 | head -1)" >> ci.log
          for root in "${ANDROID_SDK_ROOT:-}" /usr/local/lib/android/sdk /opt/android-sdk; do
            if [ -n "$root" ] && [ -d "$root/platforms" ]; then
              echo "D: sdk=$root" >> ci.log
              echo "ANDROID_SDK_ROOT=$root" >> "$GITHUB_ENV"
              break
            fi
          done

      - name: Gradle build
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon :app:assembleRelease 2>&1 | tee -a ci.log

      - name: Verify APK contents
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk | head -1)
          unzip -p "$apk" assets/ksud > /tmp/apk-ksud
          echo "E: apk=$(basename "$apk") ksud=$(sha256sum /tmp/apk-ksud | awk '{print $1}')" >> ci.log
          echo "$KSUSD_SHA256  /tmp/apk-ksud" | sha256sum -c - >> ci.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lhasa26-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          ver=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -1)
          apk=$(ls app/build/outputs/apk/release/*.apk | head -1)
          sha=$(sha256sum "$apk" | awk '{print $1}')
          tag="v${ver}"
          notes=$(printf '## 18fold越狱 %s\n\n- APK: `%s`\n- sha256: `%s`\n- KernelSU ksud: `%s`\n- 固定签名：与之前版本可覆盖安装\n\n> 本包为 main 分支 `%s` 构建；`design/miuix-console` 新控制台尚未并入 app 模块。\n' \
            "$ver" "$(basename "$apk")" "$sha" "$KSUSD_SHA256" "${GITHUB_SHA:0:8}")
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists, uploading another asset"
            gh release upload "$tag" "$apk#lhasa26-${ver}-$(echo "$sha" | cut -c1-8).apk" --clobber
          else
            gh release create "$tag" "$apk#lhasa26-${ver}.apk" \
              --title "18fold越狱 ${ver}" \
              --notes "$notes" \
              --target "$GITHUB_SHA"
          fi
          echo "F: release $tag published" >> ci.log

      - name: Record build
        if: success()
        run: |
          {
            echo "Build and upload succeeded."
            echo
            echo '```text'
            sha256sum app/build/outputs/apk/release/*.apk
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record failure
        if: failure()
        run: echo "See the first failed step in this job for the error." >> "$GITHUB_STEP_SUMMARY"

      - name: Publish result tag
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          set +e
          git config user.name "lhasa-ci"
          git config user.email "lhasa-ci@users.noreply.github.com"
          ver=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -1)
          apk=$(ls app/build/outputs/apk/release/*.apk 2>/dev/null | head -1)
          if [ "$RESULT" = "success" ] && [ -n "$apk" ]; then
            sha=$(sha256sum "$apk" | awk '{print $1}')
            tag="apk-${ver}-$(echo "$sha" | cut -c1-12)"
          else
            hint=$(grep -i -E 'error:|FAILURE:' ci.log 2>/dev/null | tail -1 | tr -c 'A-Za-z0-9._' '-' | cut -c1-60)
            tag="fail-${ver}-${hint:-unknown}"
          fi
          git tag -f "$tag"
          git push origin "refs/tags/$tag" --force
          echo "tagged $tag" >> "$GITHUB_STEP_SUMMARY"
