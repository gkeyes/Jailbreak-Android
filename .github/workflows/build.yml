name: build-apk

on:
  push:
    branches: [ main, fix/android-safety-and-logs ]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradlew'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  LHASA_STORE_PASSWORD: lhasa26pass
  LHASA_KEY_ALIAS: lhasa26
  LHASA_KEY_PASSWORD: lhasa26pass
  KSUSD_SHA256: 4f7d5fd65631915ea579ff406bd9cbe58217f2c91dac6527f5b2f28ad4508171
  KSU_APK_SHA256: b4a059ace71de2fa65cc7f12b1c58d55fc23ab25e057ee4230ce779742abe450

jobs:
  build:
    if: "!contains(github.event.head_commit.message, 'ci: signed apk ok') && !contains(github.event.head_commit.message, 'ci: build failed') && !contains(github.event.head_commit.message, 'ci: audit fixes applied')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Marker A (checkout)
        run: |
          echo "A: checkout ok $(date -u +%H:%M:%S)" > ci.log
          sha256sum app/src/main/assets/ksud >> ci.log

      - name: Apply audit fixes (idempotent)
        run: |
          set -o pipefail
          python3 - <<'PY' 2>&1 | tee -a ci.log
          import pathlib, sys

          def patch(path, pairs):
              p = pathlib.Path(path)
              text = p.read_text(encoding='utf-8')
              changed = False
              for marker, old, new in pairs:
                  if new in text:
                      print('skip  %-28s already applied' % marker)
                      continue
                  if old not in text:
                      sys.exit('MARKER-NOT-FOUND %s in %s' % (marker, path))
                  text = text.replace(old, new, 1)
                  changed = True
                  print('apply %-28s %s' % (marker, path))
              if changed:
                  p.write_text(text, encoding='utf-8')
              return changed

          changed = False

          changed |= patch('app/src/main/java/com/gkeyes/lhasa26/core/CommandExecutor.java', [
              ('executor-kill-api',
               "    boolean isAvailable();\n",
               "    boolean isAvailable();\n"
               "\n"
               "    /** Stops whatever remote process is currently running, if any. */\n"
               "    default void kill() {\n"
               "    }\n"),
              ('read-process-timeout',
               "        int exitCode = process.waitFor();\n"
               "        joinQuietly(stdout);\n"
               "        joinQuietly(stderr);\n",
               "        int exitCode;\n"
               "        if (!process.waitFor(120L, java.util.concurrent.TimeUnit.SECONDS)) {\n"
               "            process.destroy();\n"
               "            if (!process.waitFor(5L, java.util.concurrent.TimeUnit.SECONDS)) {\n"
               "                process.destroyForcibly();\n"
               "            }\n"
               "            joinQuietly(stdout);\n"
               "            joinQuietly(stderr);\n"
               "            output.append(\"命令超时（120 秒）\");\n"
               "            return output.toString();\n"
               "        }\n"
               "        exitCode = process.exitValue();\n"
               "        joinQuietly(stdout);\n"
               "        joinQuietly(stderr);\n"),
          ])

          changed |= patch('app/src/main/java/com/gkeyes/lhasa26/core/ShizukuExecutor.java', [
              ('executor-track-and-kill',
               "        Process process = newProcess(new String[]{\"sh\", \"-c\", command}, ENV, WORK_DIR);\n"
               "        if (process == null) {\n"
               "            throw new IllegalStateException(\"Shizuku 拒绝启动 shell 进程\");\n"
               "        }\n"
               "        return process;\n"
               "    }\n",
               "        Process process = newProcess(new String[]{\"sh\", \"-c\", command}, ENV, WORK_DIR);\n"
               "        if (process == null) {\n"
               "            throw new IllegalStateException(\"Shizuku 拒绝启动 shell 进程\");\n"
               "        }\n"
               "        active = process;\n"
               "        return process;\n"
               "    }\n"
               "\n"
               "    private volatile Process active;\n"
               "\n"
               "    @Override\n"
               "    public void kill() {\n"
               "        Process current = active;\n"
               "        active = null;\n"
               "        if (current == null) {\n"
               "            return;\n"
               "        }\n"
               "        try {\n"
               "            current.destroy();\n"
               "        } catch (Throwable ignored) {\n"
               "            // The remote process may already be gone.\n"
               "        }\n"
               "        try {\n"
               "            current.destroyForcibly();\n"
               "        } catch (Throwable ignored) {\n"
               "            // Nothing else to do.\n"
               "        }\n"
               "    }\n"),
              ('run-timeout',
               "        int exitCode = process.waitFor();\n"
               "        outThread.join(8000L);\n"
               "        errThread.join(8000L);\n",
               "        if (!process.waitFor(120L, java.util.concurrent.TimeUnit.SECONDS)) {\n"
               "            kill();\n"
               "            outThread.join(2000L);\n"
               "            errThread.join(2000L);\n"
               "            return new CommandResult(-1, \"命令超时（120 秒）：\" + command);\n"
               "        }\n"
               "        int exitCode = process.exitValue();\n"
               "        outThread.join(8000L);\n"
               "        errThread.join(8000L);\n"),
              ('clear-active',
               "        return new CommandResult(exitCode, combined);\n",
               "        active = null;\n"
               "        return new CommandResult(exitCode, combined);\n"),
          ])

          changed |= patch('app/src/main/java/com/gkeyes/lhasa26/core/WorkflowEngine.java', [
              ('device-info-field',
               "    private volatile String enforceBeforeRun = \"\";\n",
               "    private volatile String enforceBeforeRun = \"\";\n"
               "    private volatile long lastDeviceRefresh;\n"),
              ('stop-kills-process',
               "    public void stop() {\n"
               "        worker.shutdownNow();\n"
               "    }\n",
               "    public void stop() {\n"
               "        worker.shutdownNow();\n"
               "        executor.kill();\n"
               "    }\n"),
              ('device-info-single-command',
               "                DeviceSnapshot snapshot = new DeviceSnapshot(\n"
               "                        run(\"getprop ro.product.device\", true).output,\n"
               "                        run(\"getprop ro.build.version.incremental\", true).output,\n"
               "                        run(\"uname -r\", true).output);\n",
               "                long now = System.currentTimeMillis();\n"
               "                if (now - lastDeviceRefresh < 5000L) {\n"
               "                    return;\n"
               "                }\n"
               "                lastDeviceRefresh = now;\n"
               "                String[] fields = run(\"getprop ro.product.device; getprop ro.build.version.incremental; uname -r\", true)\n"
               "                        .output.trim().split(\"\\\\n\");\n"
               "                DeviceSnapshot snapshot = new DeviceSnapshot(\n"
               "                        fields.length > 0 ? fields[0] : \"\",\n"
               "                        fields.length > 1 ? fields[1] : \"\",\n"
               "                        fields.length > 2 ? fields[2] : \"\");\n"),
              ('defer-rooted-event',
               "        state = State.ROOTED;\n"
               "        callbacks.onState(State.ROOTED, \"已获得临时 ROOT\");\n",
               "        state = State.ROOTED;\n"
               "        callbacks.onStatus(\"已获得临时 ROOT · 正在加载 KernelSU\");\n"),
              ('maintenance-gate',
               "    private CommandResult run(String command, boolean quiet) throws Exception {\n"
               "        return executor.run(command, quiet);\n"
               "    }\n",
               "    /** Runs a maintenance command through the same busy gate as the exploit workflow. */\n"
               "    public boolean runMaintenance(String command) {\n"
               "        return start(\"maint\", () -> {\n"
               "            CommandResult result = run(command, true);\n"
               "            append(result.isSuccess() ? \"维护命令完成\" : \"维护命令失败：\" + result.output);\n"
               "        }, false);\n"
               "    }\n"
               "\n"
               "    private CommandResult run(String command, boolean quiet) throws Exception {\n"
               "        return executor.run(command, quiet);\n"
               "    }\n"),
          ])

          changed |= patch('app/src/main/java/com/gkeyes/lhasa26/MainActivity.java', [
              ('timer-250ms-foreground',
               "            timer.setText(\"用时 \" + elapsedText(SystemClock.elapsedRealtime() - startAt));\n"
               "            mainHandler.postDelayed(this, 50L);\n",
               "            if (hasWindowFocus()) {\n"
               "                timer.setText(\"用时 \" + elapsedText(SystemClock.elapsedRealtime() - startAt));\n"
               "            }\n"
               "            mainHandler.postDelayed(this, 250L);\n"),
              ('running-disables-buttons',
               "            if (state == WorkflowEngine.State.RUNNING) {\n"
               "                status.setText(\"正在运行\");\n"
               "                return;\n"
               "            }\n",
               "            if (state == WorkflowEngine.State.RUNNING) {\n"
               "                status.setText(\"正在运行\");\n"
               "                action.setEnabled(false);\n"
               "                diagnose.setEnabled(false);\n"
               "                spinner.setVisibility(View.VISIBLE);\n"
               "                return;\n"
               "            }\n"),
              ('maintenance-through-engine',
               "    private void runMaintenance(String command, String success) {\n"
               "        if (!ensureShizuku()) {\n"
               "            return;\n"
               "        }\n"
               "        new Thread(() -> {\n"
               "            try {\n"
               "                CommandResult result = executor.run(command, true);\n"
               "                runOnUiThread(() -> toast(result.isSuccess() ? success : \"命令执行失败：\" + result.output));\n"
               "            } catch (Exception error) {\n"
               "                runOnUiThread(() -> toast(\"命令执行失败：\" + error.getMessage()));\n"
               "            }\n"
               "        }, \"lhasa-maintenance\").start();\n"
               "    }\n",
               "    private void runMaintenance(String command, String success) {\n"
               "        if (!ensureShizuku()) {\n"
               "            return;\n"
               "        }\n"
               "        if (!engine.runMaintenance(command)) {\n"
               "            toast(\"正在运行，维护操作已取消\");\n"
               "            return;\n"
               "        }\n"
               "        toast(success);\n"
               "    }\n"),
          ])

          if changed:
              print('changed=true')
          else:
              print('changed=false')
          pathlib.Path('/tmp/audit-changed').write_text('1' if changed else '0')
          PY
          if [ "$(cat /tmp/audit-changed)" = "1" ]; then
            git config user.name "lhasa-ci"
            git config user.email "lhasa-ci@users.noreply.github.com"
            git add app/src/main/java
            git commit -m "ci: audit fixes applied (process timeouts, maintenance gate, timer cadence)"
            git push
            echo "B: audit fixes committed" >> ci.log
          else
            echo "B: audit fixes already present" >> ci.log
          fi

      - name: Repair ksud asset
        run: |
          echo "C: ksud check start" >> ci.log
          actual=$(sha256sum app/src/main/assets/ksud | awk '{print $1}')
          if [ "$actual" = "$KSUSD_SHA256" ]; then
            echo "C: ksud ok ($actual)" >> ci.log
            exit 0
          fi
          echo "C: ksud mismatch actual=$actual, restoring from KernelSU v3.3.1" >> ci.log
          curl -fsSL -o /tmp/ksu-manager.apk \
            https://github.com/tiann/KernelSU/releases/download/v3.3.1/KernelSU_v3.3.1_32680-release.apk
          echo "$KSU_APK_SHA256  /tmp/ksu-manager.apk" | sha256sum -c - >> ci.log
          unzip -p /tmp/ksu-manager.apk lib/arm64-v8a/libksud.so > /tmp/libksud.so
          echo "$KSUSD_SHA256  /tmp/libksud.so" | sha256sum -c - >> ci.log
          cp /tmp/libksud.so app/src/main/assets/ksud
          git config user.name "lhasa-ci"
          git config user.email "lhasa-ci@users.noreply.github.com"
          git add -f app/src/main/assets/ksud
          git commit -m "ci: restore truncated ksud asset (KernelSU v3.3.1 libksud.so sha256=$KSUSD_SHA256)"
          git push

      - name: Ensure fixed signing key
        run: |
          set -e
          if [ ! -f keystore/lhasa26.jks ]; then
            mkdir -p keystore
            keytool -genkeypair -v \
              -keystore keystore/lhasa26.jks \
              -alias "$LHASA_KEY_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$LHASA_STORE_PASSWORD" \
              -keypass "$LHASA_KEY_PASSWORD" \
              -dname "CN=Lhasa26-Android, OU=local, O=local, C=CN" >> ci.log 2>&1
            git config user.name "lhasa-ci"
            git config user.email "lhasa-ci@users.noreply.github.com"
            git add -f keystore/lhasa26.jks
            git commit -m "ci: add fixed release signing key"
            git push
          fi
          echo "D: keystore ready" >> ci.log

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Marker E (java + sdk)
        run: |
          set +e
          echo "E: java $(java -version 2>&1 | head -1)" >> ci.log
          for root in "${ANDROID_SDK_ROOT:-}" /usr/local/lib/android/sdk /opt/android-sdk; do
            if [ -n "$root" ] && [ -d "$root/platforms" ]; then
              echo "E: sdk=$root" >> ci.log
              echo "ANDROID_SDK_ROOT=$root" >> "$GITHUB_ENV"
              break
            fi
          done

      - name: Gradle build
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon :app:assembleRelease 2>&1 | tee -a ci.log

      - name: Verify APK contents
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk | head -1)
          unzip -p "$apk" assets/ksud > /tmp/apk-ksud
          echo "F: apk=$(basename "$apk") ksud=$(sha256sum /tmp/apk-ksud | awk '{print $1}')" >> ci.log
          echo "$KSUSD_SHA256  /tmp/apk-ksud" | sha256sum -c - >> ci.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lhasa26-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Record build
        if: success()
        run: |
          set -e
          sha=$(sha256sum app/build/outputs/apk/release/*.apk | awk '{print $1}')
          ksud=$(unzip -p app/build/outputs/apk/release/*.apk assets/ksud | sha256sum | awk '{print $1}')
          git config user.name "lhasa-ci"
          git config user.email "lhasa-ci@users.noreply.github.com"
          git commit --allow-empty -m "ci: signed apk ok sha256=$sha ksud=$ksud"
          git push

      - name: Record failure
        if: failure()
        run: |
          git config user.name "lhasa-ci"
          git config user.email "lhasa-ci@users.noreply.github.com"
          excerpt=$(tail -c 600 ci.log 2>/dev/null | tr '\n' ' ' | tr -s ' ' | cut -c1-400)
          git commit --allow-empty -m "ci: build failed :: ${excerpt:-no-log}"
          git push
