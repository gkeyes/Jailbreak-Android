name: build-apk

# main 的发布构建。只做两件事：构建、按需发布。
#
# 与旧版的区别（审计 P1）：
#   - 不再把签名口令写死在 workflow 里（原来 env 里是 lhasa26pass）；
#   - 不再在 CI 里生成 keystore 并 commit 回仓库；
#   - 不再「发现 ksud 不对就用 curl 拉一份覆盖并提交」，改为按锁文件校验，不合格就失败；
#   - 不再往分支推 build-state / design-state 之类的状态 tag；
#   - 权限按 job 拆开：build 只读，release 才给 contents: write。

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'design/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradlew'
      - 'tools/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare SDK
        run: |
          set +e
          for root in "${ANDROID_SDK_ROOT:-}" /usr/local/lib/android/sdk /opt/android-sdk; do
            if [ -n "$root" ] && [ -d "$root/platforms" ]; then
              echo "ANDROID_SDK_ROOT=$root" >> "$GITHUB_ENV"
              if [ -x "$root/cmdline-tools/latest/bin/sdkmanager" ]; then
                yes | "$root/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1
              fi
              break
            fi
          done

      - name: 资产台账
        run: python3 tools/check_assets.py --strict

      - name: 校验 ksud（不匹配即失败，不再自动覆盖）
        run: bash tools/fetch_ksud.sh

      - name: 准备签名材料
        env:
          KEYSTORE_B64: ${{ secrets.LHASA_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p keystore
            printf '%s' "$KEYSTORE_B64" | base64 -d > keystore/lhasa26.jks
            echo "签名材料已从 Secrets 还原"
          elif [ -f keystore/lhasa26.jks ] && [ -n "${{ secrets.LHASA_STORE_PASSWORD }}" ]; then
            echo "使用仓库内已有的 keystore + Secrets 口令"
          elif [ "${{ contains(github.event.head_commit.message, '[release]') }}" = "true" ]; then
            echo "::error::这次提交要求发布正式包，但签名材料与口令 Secrets 未配置"
            exit 1
          else
            echo "::warning::未配置签名 Secrets，本次 release APK 未签名"
          fi

      - name: Gradle build
        env:
          LHASA_KEYSTORE: keystore/lhasa26.jks
          LHASA_STORE_PASSWORD: ${{ secrets.LHASA_STORE_PASSWORD }}
          LHASA_KEY_ALIAS: ${{ secrets.LHASA_KEY_ALIAS }}
          LHASA_KEY_PASSWORD: ${{ secrets.LHASA_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon :app:assembleRelease 2>&1 | tee build.log

      - name: 校验 APK
        run: |
          set -e
          apk=$(ls app/build/outputs/apk/release/*.apk | head -1)
          want=$(sed -n 's/^sha256=//p' tools/ksud.lock.properties)
          unzip -p "$apk" "assets/ksud" > /tmp/apk-ksud
          actual=$(sha256sum /tmp/apk-ksud | awk '{print $1}')
          if [ "$actual" != "$want" ]; then
            echo "::error::APK 里的 assets/ksud 与锁文件不符：$actual != $want"
            exit 1
          fi
          size=$(stat -c%s "$apk")
          sha=$(sha256sum "$apk" | awk '{print $1}')
          echo "APK $size bytes sha256=$sha" >> "$GITHUB_STEP_SUMMARY"

          apksigner=$(ls "$ANDROID_SDK_ROOT"/build-tools/*/apksigner 2>/dev/null | tail -1)
          if [ -n "$apksigner" ]; then
            if "$apksigner" verify --print-certs "$apk" > /tmp/certs.txt 2>&1; then
              cat /tmp/certs.txt >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning::APK 未签名或签名无效（未配置签名 Secrets 时属预期）"
            fi
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lhasa26-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

  release:
    needs: build
    if: contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            app/build.gradle.kts
            tools/ksud.lock.properties

      - uses: actions/download-artifact@v4
        with:
          name: lhasa26-release-apk
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          apk=$(ls dist/*.apk | head -1)
          ver=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -1)
          sha=$(sha256sum "$apk" | awk '{print $1}')
          size=$(stat -c%s "$apk")
          tag="v${ver}"
          asset="dist/lhasa26-${ver}.apk"
          cp "$apk" "$asset"
          ksud=$(sed -n 's/^sha256=//p' tools/ksud.lock.properties)
          notes=$(printf '## 18fold越狱 %s\n\n- size: %s bytes\n- sha256: `%s`\n- ksud: `%s`\n- commit: `%s`\n' \
            "$ver" "$size" "$sha" "$ksud" "${GITHUB_SHA:0:8}")
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$asset" --clobber
          else
            gh release create "$tag" "$asset" --title "18fold越狱 ${ver}" --notes "$notes" --target "$GITHUB_SHA"
          fi
