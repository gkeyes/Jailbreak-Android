name: branch-build

# 只为 feature 分支产物：build.yml 只监听 main，所以分支上的改动不会自动出 APK。
# 校验通过后把这个文件删掉即可，main 的行为不受影响。
on:
  push:
    branches: [ fix/p0-clean-boot-retry ]
  workflow_dispatch:

permissions:
  contents: write

env:
  LHASA_STORE_PASSWORD: lhasa26pass
  LHASA_KEY_ALIAS: lhasa26
  LHASA_KEY_PASSWORD: lhasa26pass

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare SDK
        run: |
          set +e
          for root in "${ANDROID_SDK_ROOT:-}" /usr/local/lib/android/sdk /opt/android-sdk; do
            if [ -n "$root" ] && [ -d "$root/platforms" ]; then
              echo "ANDROID_SDK_ROOT=$root" >> "$GITHUB_ENV"
              if [ -x "$root/cmdline-tools/latest/bin/sdkmanager" ]; then
                yes | "$root/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1
              fi
              break
            fi
          done

      - name: Gradle build
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon :app:assembleRelease 2>&1 | tee build.log

      - name: Verify APK
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk | head -1)
          size=$(stat -c%s "$apk")
          sha=$(sha256sum "$apk" | awk '{print $1}')
          echo "APK $size bytes sha256=$sha" >> "$GITHUB_STEP_SUMMARY"
          apksigner=$(ls "$ANDROID_SDK_ROOT"/build-tools/*/apksigner 2>/dev/null | tail -1)
          if [ -n "$apksigner" ]; then
            "$apksigner" verify --print-certs "$apk" >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lhasa26-branch-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      # 结果写成 tag，这样不用登录 Actions 页面也能确认这次构建成没成。
      - name: Result tag
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          set +e
          git config user.name "lhasa-ci"
          git config user.email "lhasa-ci@users.noreply.github.com"
          git ls-remote --tags origin | awk '{print $2}' | grep -v '\^{}' \
            | grep -E '^refs/tags/branch-state-' \
            | while read -r ref; do git push origin ":$ref"; done
          apk=$(ls app/build/outputs/apk/release/*.apk 2>/dev/null | head -1)
          if [ "$RESULT" = "success" ] && [ -n "$apk" ]; then
            sha=$(sha256sum "$apk" | awk '{print $1}')
            size=$(stat -c%s "$apk")
            tag="branch-state-ok-0.3.6-$(echo "$sha" | cut -c1-12)-s${size}"
          else
            tag="branch-state-fail-run${GITHUB_RUN_NUMBER}"
          fi
          git tag -f "$tag"
          git push origin "refs/tags/$tag" --force
