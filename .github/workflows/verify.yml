name: build

# 只读校验：跑单测 + 打包 debug APK，产物上传为运行附件。
# 不再往分支回写任何东西（除最后一份验收报告），也不再打滚动 tag。

on:
  push:
    branches: [ fix/p0-clean-boot-retry ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test, wire and assemble
        run: bash tools/ci_verify.sh
      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lhasa26-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lhasa26-build-logs
          path: |
            test.log
            build.log
            wire.log
            plant/verify-report.md
          if-no-files-found: warn
