name: verify

# 把待合并的补丁真正接到入口（WorkflowEngine.java），在入口上跑模拟任务验收，
# 把结果写回分支并把结果绑定到一个 tag 上。
on:
  push:
    branches: [ fix/p0-clean-boot-retry ]
    paths:
      - 'app/**'
      - 'docs/patch/**'
      - '.github/workflows/verify.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wire the patch into WorkflowEngine
        id: wire
        run: |
          set +e
          if git apply --check docs/patch/p0-workflow-engine.diff 2>/dev/null; then
            git apply docs/patch/p0-workflow-engine.diff
            echo "applied=yes" >> "$GITHUB_OUTPUT"
            echo "补丁已应用。"
          elif git apply --check -R docs/patch/p0-workflow-engine.diff 2>/dev/null; then
            echo "applied=already" >> "$GITHUB_OUTPUT"
            echo "补丁已经嵌入源码，跳过。"
          else
            echo "applied=conflict" >> "$GITHUB_OUTPUT"
            echo "::error::补丁无法应用，源码已偏离补丁基线"
            exit 1
          fi
          git diff --stat

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare SDK
        run: |
          set +e
          for root in "${ANDROID_SDK_ROOT:-}" /usr/local/lib/android/sdk /opt/android-sdk; do
            if [ -n "$root" ] && [ -d "$root/platforms" ]; then
              echo "ANDROID_SDK_ROOT=$root" >> "$GITHUB_ENV"
              if [ -x "$root/cmdline-tools/latest/bin/sdkmanager" ]; then
                yes | "$root/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1
              fi
              break
            fi
          done

      - name: Run acceptance tests
        id: test
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon :app:testDebugUnitTest 2>&1 | tee test.log

      - name: Compile wired sources
        id: compile
        if: success()
        run: |
          set -o pipefail
          ./gradlew --no-daemon :app:compileReleaseJavaWithJavac 2>&1 | tee -a test.log

      - name: Record result and commit
        if: always()
        env:
          TEST: ${{ steps.test.outcome }}
          COMPILE: ${{ steps.compile.outcome }}
          APPLIED: ${{ steps.wire.outputs.applied }}
        run: |
          set +e
          {
            echo "# 验收结果"
            echo
            echo "- commit: \`${GITHUB_SHA:0:8}\`"
            echo "- 补丁接线：${APPLIED}"
            echo "- 单测：${TEST}"
            echo "- 编译：${COMPILE}"
            echo
            echo "## 用例"
            echo
            echo '```text'
            for f in app/build/test-results/testDebugUnitTest/*.xml; do
              [ -f "$f" ] || continue
              basename "$f"
              grep -o 'tests="[0-9]*" skipped="[0-9]*" failures="[0-9]*" errors="[0-9]*"' "$f" | head -1
            done
            echo '```'
            echo
            echo "## WorkflowEngine 是否已接线"
            echo
            echo '```text'
            grep -c 'BootGuard.classify' app/src/main/java/com/gkeyes/lhasa26/core/WorkflowEngine.java 2>/dev/null || echo 0
            grep -c 'DeployGate' app/src/main/java/com/gkeyes/lhasa26/core/WorkflowEngine.java 2>/dev/null || echo 0
            echo '```'
            echo
            echo "## 日志尾部"
            echo
            echo '```text'
            tail -n 40 test.log 2>/dev/null
            echo '```'
          } > plant/verify-report.md

          git config user.name "lhasa-ci"
          git config user.email "lhasa-ci@users.noreply.github.com"
          git add -A app docs plant/verify-report.md 2>/dev/null
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "verify: 接入 BootGuard/DeployGate，单测 ${TEST} [verify]"
            git push
          fi

      - name: Bind result to the commit
        if: always()
        env:
          TEST: ${{ steps.test.outcome }}
          COMPILE: ${{ steps.compile.outcome }}
        run: |
          set +e
          git config user.name "lhasa-ci"
          git config user.email "lhasa-ci@users.noreply.github.com"
          git ls-remote --tags origin | awk '{print $2}' | grep -v '\^{}' \
            | grep -E '^refs/tags/verify-' \
            | while read -r ref; do git push origin ":$ref"; done
          if [ "$TEST" = "success" ] && [ "$COMPILE" = "success" ]; then
            tag="verify-ok-${GITHUB_SHA:0:8}"
          else
            tag="verify-fail-${GITHUB_SHA:0:8}"
          fi
          git tag -f "$tag" "$GITHUB_SHA"
          git push origin "refs/tags/$tag" --force
          echo "tag=$tag"
