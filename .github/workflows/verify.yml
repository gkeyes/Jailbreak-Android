name: verify

# 一个工作流干完三件事，不再拆多个文件：
#   verify —— 接线、单测、release 编译，结果写回分支并打 tag；
#   plant  —— zig 交叉编译 plant/*.c，审计 assets 里还没有源码的 ELF。
# 两个 job 串行，避免同时 push 抢分支。
# 注意：本文件注释里不得出现触发器关键字。

on:
  push:
    branches: [ fix/p0-clean-boot-retry ]
    paths:
      - 'app/**'
      - 'tools/**'
      - 'plant/**'
      - '.github/workflows/verify.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wire the patch into WorkflowEngine
        id: wire
        run: |
          set -o pipefail
          python3 tools/wire_workflow.py 2>&1 | tee wire.log

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare SDK
        run: |
          set +e
          for root in "${ANDROID_SDK_ROOT:-}" /usr/local/lib/android/sdk /opt/android-sdk; do
            if [ -n "$root" ] && [ -d "$root/platforms" ]; then
              echo "ANDROID_SDK_ROOT=$root" >> "$GITHUB_ENV"
              if [ -x "$root/cmdline-tools/latest/bin/sdkmanager" ]; then
                yes | "$root/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1
              fi
              break
            fi
          done

      - name: Run acceptance tests
        id: test
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon :app:testDebugUnitTest 2>&1 | tee test.log

      - name: Compile wired sources
        id: compile
        if: always()
        run: |
          set +e
          set -o pipefail
          ./gradlew --no-daemon :app:compileReleaseJavaWithJavac 2>&1 | tee -a test.log
          exit $?

      - name: Record result and commit
        if: always()
        env:
          TEST: ${{ steps.test.outcome }}
          COMPILE: ${{ steps.compile.outcome }}
          WIRE: ${{ steps.wire.outcome }}
        run: |
          set +e
          {
            echo "# 验收结果"
            echo
            echo "- commit: \`${GITHUB_SHA:0:8}\`"
            echo "- 接线: ${WIRE}"
            echo "- 单测: ${TEST}"
            echo "- 编译: ${COMPILE}"
            echo
            echo "## 接线日志"
            echo
            echo '```text'
            cat wire.log 2>/dev/null
            echo '```'
            echo
            echo "## 用例"
            echo
            echo '```text'
            for f in app/build/test-results/testDebugUnitTest/*.xml; do
              [ -f "$f" ] || continue
              basename "$f"
              grep -o 'tests="[0-9]*" skipped="[0-9]*" failures="[0-9]*" errors="[0-9]*"' "$f" | head -1
            done
            echo '```'
            echo
            echo "## 入口是否真的调用防护"
            echo
            echo '```text'
            wf=app/src/main/java/com/gkeyes/lhasa26/core/WorkflowEngine.java
            echo "BootGuard.classify  x$(grep -c 'BootGuard.classify' "$wf" 2>/dev/null || echo 0)"
            echo "DeployGate           x$(grep -c 'DeployGate' "$wf" 2>/dev/null || echo 0)"
            echo "旧 pkill 路径       x$(grep -c 'pkill -f uaf_plant_replay' "$wf" 2>/dev/null || echo 0)"
            echo '```'
            echo
            echo "## 日志尾部"
            echo
            echo '```text'
            tail -n 30 test.log 2>/dev/null
            echo '```'
          } > plant/verify-report.md

          git config user.name "lhasa-ci"
          git config user.email "lhasa-ci@users.noreply.github.com"
          git add -A app plant/verify-report.md 2>/dev/null
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "verify: 接入 BootGuard/DeployGate，单测 ${TEST} [verify]"
            git push
          fi

      - name: Bind result to the commit
        if: always()
        env:
          TEST: ${{ steps.test.outcome }}
          COMPILE: ${{ steps.compile.outcome }}
          WIRE: ${{ steps.wire.outcome }}
        run: |
          set +e
          git config user.name "lhasa-ci"
          git config user.email "lhasa-ci@users.noreply.github.com"
          git ls-remote --tags origin | awk '{print $2}' | grep -v '\^{}' \
            | grep -E '^refs/tags/verify-' \
            | while read -r ref; do git push origin ":$ref"; done
          if [ "$TEST" = "success" ] && [ "$COMPILE" = "success" ] && [ "$WIRE" = "success" ]; then
            tag="verify-ok-${GITHUB_SHA:0:8}"
          else
            tag="verify-fail-${GITHUB_SHA:0:8}"
          fi
          git tag -f "$tag" "$GITHUB_SHA"
          git push origin "refs/tags/$tag" --force
          echo "tag=$tag"

  plant:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p0-clean-boot-retry

      - name: Install zig
        run: |
          set -e
          curl -fsSL -o /tmp/zig.tar.xz https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz
          tar -xf /tmp/zig.tar.xz -C /tmp
          echo "/tmp/zig-linux-x86_64-0.13.0" >> "$GITHUB_PATH"

      - name: Audit assets and compile plant sources
        run: |
          set +e
          export PATH="/tmp/zig-linux-x86_64-0.13.0:$PATH"
          mkdir -p plant/out
          python3 - > plant/audit.log <<'PY'
          import pathlib
          assets = pathlib.Path("app/src/main/assets")
          sources = {p.name[:-2] for p in pathlib.Path("plant").glob("*.c")}
          missing = []
          print(f"{'status':8} {'asset':22} {'size':>10}  source")
          for path in sorted(assets.iterdir()):
              if not path.is_file():
                  continue
              if path.open("rb").read(4) != b"\x7fELF":
                  continue
              has = path.name in sources
              if not has:
                  missing.append(path.name)
              print(f"{'OK' if has else 'MISSING':8} {path.name:22} {path.stat().st_size:>10}  {path.name + '.c' if has else '-'}")
          print()
          print(f"合计 {len(missing)} 个资产尚无源码")
          PY
          cat plant/audit.log
          : > plant/build.log
          failed=0
          for src in plant/*.c; do
            [ -e "$src" ] || continue
            out="plant/out/$(basename "${src%.c}")"
            echo "== zig cc $src -> $out" >> plant/build.log
            if zig cc -target aarch64-linux-musl -O2 -static -pthread "$src" -o "$out" >> plant/build.log 2>&1; then
              file "$out" >> plant/build.log
            else
              echo "FAILED $src" >> plant/build.log
              failed=1
            fi
          done
          ls -l plant/out >> plant/build.log 2>&1
          echo "failed=$failed" >> plant/build.log
          {
            echo "# plant 构建状态"
            echo
            echo "- commit: \`${GITHUB_SHA:0:8}\`"
            echo "- failed: ${failed}"
            echo
            echo "## 资产审计"
            echo
            echo '```text'
            cat plant/audit.log
            echo '```'
            echo
            echo "## 编译日志"
            echo
            echo '```text'
            tail -n 80 plant/build.log
            echo '```'
          } > plant/build-status.md
          git config user.name "lhasa-ci"
          git config user.email "lhasa-ci@users.noreply.github.com"
          git add plant/build-status.md plant/build.log plant/audit.log
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "plant: 交叉编译结果 failed=${failed} [plant]"
            git push
          fi
          exit $failed

      - name: Upload plant binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plant-binaries
          path: plant/out/*
          if-no-files-found: ignore
