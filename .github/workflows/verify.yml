name: verify

# 只读校验：资产台账 + 单测 + 组装 debug APK，产物作为运行附件上传。
# 本工作流对仓库没有任何写权限（contents: read），验收结果与本次 SHA 一一对应。

on:
  push:
    branches: [ fix/p0-clean-boot-retry, chore/assets-ledger ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Assets ledger, tests and assemble
        run: bash tools/ci_verify.sh
      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lhasa26-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lhasa26-build-logs
          path: |
            ${{ runner.temp }}/verify-report.md
            ${{ runner.temp }}/test.log
            ${{ runner.temp }}/build.log
            ${{ runner.temp }}/assets.log
          if-no-files-found: warn
