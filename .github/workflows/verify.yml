name: verify

# 只读校验：资产台账 + 单测 + 组装 debug APK。
#
# 唯一的写权限是 issues：写，且只在失败时用它把日志写进一条 issue——
# CI 日志在 MCP 侧取不到，落在 issue 里才能被程序读到。仓库内容零写入。

on:
  push:
    branches: [ next ]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        id: checkout
      - uses: actions/setup-java@v4
        id: java
        with:
          distribution: temurin
          java-version: '17'
      - name: Assets ledger, tests and assemble
        id: verify
        run: |
          set -o pipefail
          bash tools/ci_verify.sh 2>&1 | tee "$RUNNER_TEMP/verify.log"
      - name: Upload APK
        id: upload_apk
        if: success() && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[apk]'))
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: lhasa26-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 2
      - name: Upload logs
        id: upload_logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: lhasa26-build-logs
          path: |
            ${{ runner.temp }}/verify.log
            ${{ runner.temp }}/verify-report.md
            ${{ runner.temp }}/test.log
            ${{ runner.temp }}/build.log
            ${{ runner.temp }}/assets.log
          if-no-files-found: warn
          retention-days: 2
      - name: 失败时把日志写进 issue
        id: report
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          OUT_CHECKOUT: ${{ steps.checkout.outcome }}
          OUT_JAVA: ${{ steps.java.outcome }}
          OUT_VERIFY: ${{ steps.verify.outcome }}
          OUT_UPLOAD_APK: ${{ steps.upload_apk.outcome }}
          OUT_UPLOAD_LOGS: ${{ steps.upload_logs.outcome }}
        run: |
          set -uo pipefail
          title="ci: verify 失败 ${GITHUB_SHA:0:8}"
          body="$RUNNER_TEMP/ci-failure.md"
          {
            echo "commit: \`$GITHUB_SHA\`"
            echo
            echo "### 各步结果"
            echo '```text'
            echo "checkout      = ${OUT_CHECKOUT}"
            echo "setup-java    = ${OUT_JAVA}"
            echo "verify.sh     = ${OUT_VERIFY}"
            echo "upload APK    = ${OUT_UPLOAD_APK}"
            echo "upload logs   = ${OUT_UPLOAD_LOGS}"
            echo '```'
            echo "### 报错行"
            echo '```text'
            grep -nE '(^e: |error:|FAILURE:|Caused by:|What went wrong|> Task .* FAILED|BUILD FAILED)' \
              "$RUNNER_TEMP/verify.log" "$RUNNER_TEMP/test.log" "$RUNNER_TEMP/build.log" 2>/dev/null | head -60 \
              || echo "（没有匹配的报错行）"
            echo '```'
            echo "### verify.sh 输出（结尾）"
            echo '```text'
            tail -c 12000 "$RUNNER_TEMP/verify.log" 2>/dev/null || echo "（无 verify.log）"
            echo '```'
          } > "$body"
          gh issue create --title "$title" --body-file "$body" \
            --repo "${{ github.repository }}" || echo "::warning::写 issue 失败，日志只在 Artifact 里"
