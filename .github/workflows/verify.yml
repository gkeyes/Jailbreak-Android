name: verify

# 逻辑全部在 tools/ci_verify.sh，本文件保持最小，减少 YAML 出错面。
# 注意：注释里不要出现触发器关键字。

on:
  push:
    branches: [ fix/p0-clean-boot-retry ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify, test and compile plant
        run: bash tools/ci_verify.sh
