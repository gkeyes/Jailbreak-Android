name: plant-build

# 无黑盒的守护任务：
# 1) 把 plant/*.c 交叉编译到 aarch64-linux-musl；
# 2) 列出 assets 里尚未有对应源码的 ELF（现在应为 5 个，直到被替换为止）。
on:
  push:
    branches: [ fix/p0-clean-boot-retry ]
    paths:
      - 'plant/**'
      - 'app/src/main/assets/**'
      - '.github/workflows/plant-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install zig
        run: |
          set -e
          curl -fsSL https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz -o /tmp/zig.tar.xz
          tar -xf /tmp/zig.tar.xz -C /tmp
          echo "/tmp/zig-linux-x86_64-0.13.0" >> "$GITHUB_PATH"
          zig version

      - name: Audit assets for sourceless ELF
        run: |
          python3 - <<'PY'
          import pathlib
          assets = pathlib.Path("app/src/main/assets")
          sources = {p.stem for p in pathlib.Path("plant").glob("*.c")}
          missing = []
          for path in sorted(assets.iterdir()):
              if not path.is_file():
                  continue
              head = path.open("rb").read(4)
              if head != b"\x7fELF":
                  continue
              status = "OK" if path.stem in sources else "MISSING"
              if status == "MISSING":
                  missing.append(path.name)
              print(f"{status:8} {path.name:20} {path.stat().st_size:>9} bytes")
          lines = ["### 资产源码审计", "", "```text"]
          lines.append("\n".join(["see job log for table"]))
          lines.append("```")
          if missing:
              print(f"::warning::{len(missing)} ELF 资产尚无源码: {', '.join(missing)}")
          with open("/tmp/assets-audit.md", "w") as fh:
              fh.write(f"尚无源码的 ELF 资产：{len(missing)} 个\n\n")
              fh.write("\n".join(f"- `{m}`" for m in missing) + "\n")
          PY

      - name: Compile plant sources
        run: |
          set -e
          shopt -s nullglob
          files=(plant/*.c)
          if [ ${#files[@]} -eq 0 ]; then
            echo "plant/ 下还没有任何源码，跳过编译。" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          mkdir -p plant/out
          for src in "${files[@]}"; do
            out="plant/out/$(basename "${src%.c}")"
            echo "zig cc -target aarch64-linux-musl -O2 $src -> $out"
            zig cc -target aarch64-linux-musl -O2 -static -pthread "$src" -o "$out"
            file "$out"
          done

      - name: Upload plant binaries
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: plant-binaries
          path: plant/out/*
          if-no-files-found: ignore
