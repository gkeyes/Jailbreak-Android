name: cleanup-branch

# One-shot: after the fix branch is merged into main, delete it and remove this workflow.
on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  drop-merged-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Delete merged branch and this workflow
        run: |
          set -e
          if git ls-remote --exit-code --heads origin fix/android-safety-and-logs >/dev/null 2>&1; then
            git push origin --delete fix/android-safety-and-logs
            echo "deleted fix/android-safety-and-logs"
          else
            echo "branch already absent"
          fi
          git rm -q .github/workflows/cleanup-branch.yml
          git config user.name "lhasa-ci"
          git config user.email "lhasa-ci@users.noreply.github.com"
          git commit -m "ci: remove one-shot branch cleanup workflow"
          git push origin main
