name: plant-analysis

# 从已入库的 payload 二进制里扫出 64 位内核地址立即数与日志标记，
# 用来反推自己重写时该填的常量。结果直接提交回分支，不需要内核镜像。
on:
  push:
    branches: [ fix/p0-clean-boot-retry ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    if: "!contains(github.event.head_commit.message, '[analysis]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan payload immediates
        run: |
          mkdir -p plant
          python3 - <<'PY'
          import collections
          import pathlib
          import re

          # lhasa_profile.txt 里已知的链接期地址，用来给扫到的值打标签。
          KNOWN = {
              0xffffffc08042aa68: "profile timer (alloc_posix_timer+0x30)",
              0xffffffc08026c02c: "profile cred (prepare_creds+0x2c)",
              0xffffffc082959630: "profile selinux",
              0xffffffc0826d10d8: "profile userns",
              0xffffffc0826d1388: "profile rootuser",
              0xffffffc0826d2a48: "profile groups",
              0xffffffc0826d2f08: "profile ucounts",
              0xffffffc0801f2ec8: "profile task_site (copy_process+0x138)",
          }
          LO = 0xffffff8000000000
          HI = 0xffffffff00000000
          BASE = pathlib.Path("app/src/main/assets")
          TARGETS = ["uaf_plant_replay", "perf_slide", "slide_probe",
                     "pc98260-su", "reach_probe"]
          KEYWORDS = ("zombie", "leak", "selinux", "cred", "slide", "uid=0",
                      "holding", "perf", "ring", "pipe", "rootd", "cap")

          out = ["# payload 常量扫描", "",
                 "由 CI 从 `app/src/main/assets/` 里的二进制直接扫描得出，未执行任何代码。", ""]

          for name in TARGETS:
              path = BASE / name
              if not path.exists():
                  out += [f"## {name}", "", "资产不存在。", ""]
                  continue
              data = path.read_bytes()
              hits = collections.OrderedDict()
              for off in range(0, len(data) - 8, 4):
                  value = int.from_bytes(data[off:off + 8], "little")
                  if LO <= value < HI:
                      if value in hits:
                          hits[value][1] += 1
                      else:
                          hits[value] = [off, 1]

              rows = sorted(hits.items(), key=lambda kv: -kv[1][1])
              shown = rows[:220]
              out += [f"## {name}", "", f"`{len(data)}` bytes，内核地址立即数 `{len(hits)}` 个。", ""]
              if not hits:
                  out += ["无匹配（可能是位置无关或地址运行时计算）。", ""]
              else:
                  out += ["| addr | off | hits | note |", "|---|---|---|---|"]
                  for value, (off, count) in shown:
                      note = KNOWN.get(value, "")
                      out.append(f"| `0x{value:016x}` | `0x{off:x}` | {count} | {note} |")
                  if len(rows) > len(shown):
                      out.append("")
                      out.append(f"其余 {len(rows) - len(shown)} 项省略。")
                  out.append("")

              strings = [s.decode("ascii", "replace")
                         for s in re.findall(rb"[ -~]{6,}", data)]
              marks = [s for s in strings if any(k in s.lower() for k in KEYWORDS)]
              if marks:
                  out += ["日志标记 / 关键字：", "", "```text"]
                  out += marks[:80]
                  out.append("```")
                  out.append("")

          pathlib.Path("plant/analysis-report.md").write_text("\n".join(out) + "\n")
          print(f"wrote plant/analysis-report.md ({len(out)} lines)")
          PY

      - name: Commit report
        run: |
          git config user.name "lhasa-ci"
          git config user.email "lhasa-ci@users.noreply.github.com"
          git add plant/analysis-report.md
          if git diff --cached --quiet; then
            echo "report unchanged"
          else
            git commit -m "analysis: payload 常量与标记扫描 [analysis]"
            git push
          fi
