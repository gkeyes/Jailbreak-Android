name: plant

# plant/ 下的自有 C 源码：交叉编译 + 与原件/基线的等价性验证。
#
# 默认全只读。唯一会写仓库的是 publish job：workflow_dispatch 专用，
# 而且必须显式勾选 publish=true 才会跑。

on:
  push:
    branches: [ next ]
    paths:
      - 'plant/**'
      - 'app/src/main/assets/**'
      - 'tools/plant_build.sh'
      - 'tools/equiv.py'
      - '.github/workflows/plant.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: '把编译产物提交进 app/src/main/assets（会写仓库，并触发带签名的发布）'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

jobs:
  compile:
    name: 编译 + 等价性验证
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 资产台账
        run: python3 tools/check_assets.py

      - name: 安装 zig
        run: |
          set -e
          curl -fsSL https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz -o "$RUNNER_TEMP/zig.tar.xz"
          tar -xf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-linux-x86_64-0.13.0" >> "$GITHUB_PATH"

      - name: 编译 plant/*.c
        id: compile
        run: |
          set -uo pipefail
          shopt -s nullglob
          LOG="$RUNNER_TEMP/compile.log"
          : > "$LOG"
          files=(plant/*.c)
          mkdir -p "$RUNNER_TEMP/out"
          if [ ${#files[@]} -eq 0 ]; then
            echo "plant/ 下还没有源码。" | tee -a "$LOG"
            exit 0
          fi
          CFLAGS=(-target aarch64-linux-musl -O2 -static -s
                  -ffunction-sections -fdata-sections -Wl,--gc-sections
                  -fno-asynchronous-unwind-tables -fno-unwind-tables -pthread)
          status=0
          for src in "${files[@]}"; do
            out="$RUNNER_TEMP/out/$(basename "${src%.c}")"
            echo "== zig cc $src -> $out" | tee -a "$LOG"
            if zig cc "${CFLAGS[@]}" "$src" -o "$out" 2>&1 | tee -a "$LOG"; then
              ls -l "$out" | tee -a "$LOG"
            else
              echo "::error::编译失败 $src"
              status=1
            fi
          done
          exit $status

      - name: 等价性验证
        id: equiv
        if: always()
        run: |
          set -uo pipefail
          python3 tools/equiv.py check-dir "$RUNNER_TEMP/out" 2>&1 | tee "$RUNNER_TEMP/equiv.log"
          exit "${PIPESTATUS[0]}"

      - name: 导出字符串表
        if: always()
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/strings"
          for name in uaf_plant_replay reach_probe slide_probe perf_slide pc98260-su; do
            src="app/src/main/assets/$name"
            [ -f "$src" ] && strings -n 4 "$src" | sort -u > "$RUNNER_TEMP/strings/$name.orig.txt"
            [ -f "$RUNNER_TEMP/out/$name" ] && \
              strings -n 4 "$RUNNER_TEMP/out/$name" | sort -u > "$RUNNER_TEMP/strings/$name.rebuilt.txt"
          done
          wc -l "$RUNNER_TEMP"/strings/*.txt || true

      - name: 上传产物
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: plant-binaries
          path: |
            ${{ runner.temp }}/out/*
            ${{ runner.temp }}/equiv.log
            ${{ runner.temp }}/compile.log
            ${{ runner.temp }}/strings/*.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: 失败时把日志写进 issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          OUT_COMPILE: ${{ steps.compile.outcome }}
          OUT_EQUIV: ${{ steps.equiv.outcome }}
        run: |
          set -uo pipefail
          body="$RUNNER_TEMP/plant-failure.md"
          {
            echo "commit: \`$GITHUB_SHA\`"
            echo
            echo "### 各步结果"
            echo '```text'
            echo "compile = ${OUT_COMPILE}"
            echo "equiv   = ${OUT_EQUIV}"
            echo '```'
            echo "### 报错行"
            echo '```text'
            grep -nE '(^e: |error:|FAIL |GAP |FAILED)' "$RUNNER_TEMP/compile.log" "$RUNNER_TEMP/equiv.log" 2>/dev/null | head -60 \
              || echo "（无）"
            echo '```'
            echo "### compile.log"
            echo '```text'
            tail -c 10000 "$RUNNER_TEMP/compile.log" 2>/dev/null || echo "（无）"
            echo '```'
            echo "### equiv.log"
            echo '```text'
            tail -c 10000 "$RUNNER_TEMP/equiv.log" 2>/dev/null || echo "（无）"
            echo '```'
          } > "$body"
          gh issue create --title "ci: plant 失败 ${GITHUB_SHA:0:8}" --body-file "$body" \
            --repo "${{ github.repository }}" || true

  publish:
    name: 把自有产物替换进 assets
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: compile
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: plant-binaries
          path: "${{ runner.temp }}/plant"

      - name: 归档原件基线（严格模式的参照）
        run: |
          set -e
          python3 tools/equiv.py baseline
          ls -l plant/equiv/

      - name: 用自有产物覆盖 assets
        run: |
          set -e
          for name in reach_probe slide_probe perf_slide pc98260-su; do
            src="$RUNNER_TEMP/plant/$name"
            if [ ! -f "$src" ]; then
              echo "::error::缺少产物 $name"
              exit 1
            fi
            cp "$src" "app/src/main/assets/$name"
            chmod 755 "app/src/main/assets/$name"
            ls -l "app/src/main/assets/$name"
          done

      - name: 同步台账
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, subprocess, datetime

          ledger_path = pathlib.Path("tools/assets-ledger.json")
          ledger = json.loads(ledger_path.read_text(encoding="utf-8"))
          sources = {
              "reach_probe": "plant/reach_probe.c",
              "slide_probe": "plant/slide_probe.c",
              "perf_slide": "plant/perf_slide.c",
              "pc98260-su": "plant/pc98260-su.c",
          }
          today = datetime.date.today().isoformat()
          for entry in ledger["assets"]:
              name = entry.get("name")
              if name not in sources:
                  continue
              path = pathlib.Path(entry["path"])
              data = path.read_bytes()
              blob = subprocess.check_output(["git", "hash-object", str(path)]).decode().strip()
              entry["size"] = len(data)
              entry["sha256"] = hashlib.sha256(data).hexdigest()
              entry["gitBlobSha1"] = blob
              entry["origin"] = "rebuilt-from-source"
              entry["sourceDraft"] = sources[name]
              entry["status"] = "rebuilt"
              entry["action"] = f"{today} 由 {sources[name]} 交叉编译后替换；基线见 plant/equiv/{name}.json"
          ledger["updatedAt"] = today
          ledger_path.write_text(json.dumps(ledger, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print("台账已更新")
          PY
          python3 tools/check_assets.py --strict

      - name: 提交
        run: |
          set -e
          git config user.name "lhasa-ci"
          git config user.email "lhasa-ci@users.noreply.github.com"
          git add -A app/src/main/assets plant/equiv tools/assets-ledger.json
          if git diff --cached --quiet; then
            echo "没有变化，跳过提交"
            exit 0
          fi
          git commit -m "feat(assets): 四个探针改为自有源码构建产物 [apk] [release]

- reach_probe / slide_probe / perf_slide / pc98260-su 由 plant/*.c 交叉编译替换
- 原件指纹归档到 plant/equiv/，此后等价性检查进入严格模式
- 台账同步：origin=rebuilt-from-source、status=rebuilt
- uaf_plant_replay 与 ksud 保持原样（前者无源码，后者上游开源）"
          git push

  scan:
    name: 现有 payload 常量扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 扫描 64 位内核立即数与日志标记
        run: |
          python3 - <<'PY'
          import collections, pathlib, re, os

          KNOWN = {
              0xffffffc08042aa68: "profile timer (alloc_posix_timer+0x30)",
              0xffffffc08026c02c: "profile cred (prepare_creds+0x2c)",
              0xffffffc082959630: "profile selinux",
              0xffffffc0826d10d8: "profile userns",
              0xffffffc0826d1388: "profile rootuser",
              0xffffffc0826d2a48: "profile groups",
              0xffffffc0826d2f08: "profile ucounts",
              0xffffffc0801f2ec8: "profile task_site (copy_process+0x138)",
          }
          LO, HI = 0xffffff8000000000, 0xffffffff00000000
          BASE = pathlib.Path("app/src/main/assets")
          TARGETS = ["uaf_plant_replay", "perf_slide", "slide_probe", "pc98260-su", "reach_probe"]
          KEYWORDS = ("zombie", "leak", "selinux", "cred", "slide", "uid=0",
                      "holding", "perf", "ring", "pipe", "rootd", "cap")

          out = ["# payload 常量扫描", "",
                 "由 CI 从 `app/src/main/assets/` 的二进制直接扫描得出，未执行任何代码。", ""]

          for name in TARGETS:
              path = BASE / name
              if not path.exists():
                  out += [f"## {name}", "", "资产不存在。", ""]
                  continue
              data = path.read_bytes()
              hits = collections.OrderedDict()
              for off in range(0, len(data) - 8, 4):
                  value = int.from_bytes(data[off:off + 8], "little")
                  if LO <= value < HI:
                      if value in hits:
                          hits[value][1] += 1
                      else:
                          hits[value] = [off, 1]

              rows = sorted(hits.items(), key=lambda kv: -kv[1][1])
              shown = rows[:220]
              out += [f"## {name}", "", f"`{len(data)}` bytes，内核地址立即数 `{len(hits)}` 个。", ""]
              if not hits:
                  out += ["无匹配（位置无关或运行时计算）。", ""]
              else:
                  out += ["| addr | off | hits | note |", "|---|---|---|---|"]
                  for value, (off, count) in shown:
                      out.append(f"| `0x{value:016x}` | `0x{off:x}` | {count} | {KNOWN.get(value, '')} |")
                  if len(rows) > len(shown):
                      out += ["", f"其余 {len(rows) - len(shown)} 项省略。"]
                  out.append("")

              strings = [s.decode("ascii", "replace") for s in re.findall(rb"[ -~]{6,}", data)]
              marks = [s for s in strings if any(k in s.lower() for k in KEYWORDS)]
              if marks:
                  out += ["日志标记 / 关键字：", "", "```text", *marks[:80], "```", ""]

          dest = pathlib.Path(os.environ["RUNNER_TEMP"]) / "analysis-report.md"
          dest.write_text("\n".join(out) + "\n")
          print(f"wrote {dest} ({len(out)} lines)")
          PY

      - name: 上传扫描报告
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: payload-analysis
          path: ${{ runner.temp }}/analysis-report.md
          if-no-files-found: warn
          retention-days: 2
