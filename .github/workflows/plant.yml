name: plant

# plant/ 下的自有 C 源码：交叉编译 + 与原件基线的等价性验证 + 产物分发。
#
# 默认只读。唯一会写仓库的是 publish job（提交信息含 [publish]）：
#   1. 从历史取回原件 → 归档基线（plant/equiv/，只归档一次）
#   2. 用新产物覆盖 app/src/main/assets/
#   3. 同步台账
#   4. 把产物写成 plant/out/<名字>.b64（单行 base64），供人在设备上直接解码运行，
#      不必每次都打 APK

on:
  push:
    branches: [ next ]
    paths:
      - 'plant/**'
      - 'app/src/main/assets/**'
      - 'tools/plant_build.sh'
      - 'tools/equiv.py'
      - '.github/workflows/plant.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  compile:
    name: 编译与等价性验证
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 资产台账
        run: python3 tools/check_assets.py

      - name: 安装 zig
        run: |
          set -e
          curl -fsSL https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz -o "$RUNNER_TEMP/zig.tar.xz"
          tar -xf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-linux-x86_64-0.13.0" >> "$GITHUB_PATH"

      - name: 编译 plant 源码
        id: compile
        run: |
          set -uo pipefail
          shopt -s nullglob
          LOG="$RUNNER_TEMP/compile.log"
          : > "$LOG"
          files=(plant/*.c)
          mkdir -p "$RUNNER_TEMP/out"
          if [ ${#files[@]} -eq 0 ]; then
            echo "plant 下还没有源码" | tee -a "$LOG"
            exit 0
          fi
          CFLAGS=(-target aarch64-linux-musl -O2 -static -s
                  -ffunction-sections -fdata-sections -Wl,--gc-sections
                  -fno-asynchronous-unwind-tables -fno-unwind-tables -pthread)
          status=0
          for src in "${files[@]}"; do
            out="$RUNNER_TEMP/out/$(basename "${src%.c}")"
            echo "== zig cc $src -> $out" | tee -a "$LOG"
            if zig cc "${CFLAGS[@]}" "$src" -o "$out" 2>&1 | tee -a "$LOG"; then
              ls -l "$out" | tee -a "$LOG"
            else
              echo "::error::编译失败 $src"
              status=1
            fi
          done
          exit $status

      - name: 等价性验证
        id: equiv
        if: always()
        run: |
          set -uo pipefail
          python3 tools/equiv.py check-dir "$RUNNER_TEMP/out" 2>&1 | tee "$RUNNER_TEMP/equiv.log"
          exit "${PIPESTATUS[0]}"

      - name: 上传产物
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: plant-binaries
          path: |
            ${{ runner.temp }}/out/*
            ${{ runner.temp }}/equiv.log
            ${{ runner.temp }}/compile.log
          if-no-files-found: ignore
          retention-days: 3

      - name: 失败时把日志写进 issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          OUT_COMPILE: ${{ steps.compile.outcome }}
          OUT_EQUIV: ${{ steps.equiv.outcome }}
        run: |
          set -uo pipefail
          body="$RUNNER_TEMP/plant-failure.md"
          {
            echo "commit: \`$GITHUB_SHA\`"
            echo
            echo "compile = ${OUT_COMPILE}"
            echo "equiv   = ${OUT_EQUIV}"
            echo
            echo '```text'
            grep -nE '(^e: |error:|FAIL |GAP |FAILED)' "$RUNNER_TEMP/compile.log" "$RUNNER_TEMP/equiv.log" 2>/dev/null | head -60 || echo "（无报错行）"
            echo '```'
            echo '```text'
            tail -c 8000 "$RUNNER_TEMP/compile.log" 2>/dev/null || true
            tail -c 8000 "$RUNNER_TEMP/equiv.log" 2>/dev/null || true
            echo '```'
          } > "$body"
          gh issue create --title "ci: plant 失败 ${GITHUB_SHA:0:8}" --body-file "$body" \
            --repo "${{ github.repository }}" || true

  publish:
    name: 替换 assets
    if: contains(github.event.head_commit.message, '[publish]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 zig
        run: |
          set -e
          curl -fsSL https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz -o "$RUNNER_TEMP/zig.tar.xz"
          tar -xf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-linux-x86_64-0.13.0" >> "$GITHUB_PATH"

      - name: 编译
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/out" plant/out
          CFLAGS=(-target aarch64-linux-musl -O2 -static -s
                  -ffunction-sections -fdata-sections -Wl,--gc-sections
                  -fno-asynchronous-unwind-tables -fno-unwind-tables -pthread)
          for name in reach_probe slide_probe perf_slide pc98260-su; do
            zig cc "${CFLAGS[@]}" "plant/$name.c" -o "$RUNNER_TEMP/out/$name"
            ls -l "$RUNNER_TEMP/out/$name"
            # 单行 base64，供设备上直接解码运行（不经过 APK）
            base64 -w0 "$RUNNER_TEMP/out/$name" > "plant/out/$name.b64"
          done
          ls -l plant/out

      - name: 恢复原件（用于归档基线）
        run: |
          set -e
          for name in reach_probe slide_probe perf_slide pc98260-su; do
            git show "8c7de4445ed5525c5742c0b3cb35b6b4472b1b4a^:app/src/main/assets/$name" \
              > "app/src/main/assets/$name"
            echo "restored $name from history"
          done

      - name: 归档原件基线（已存在则跳过）
        run: |
          set -e
          python3 tools/equiv.py baseline
          ls -l plant/equiv/

      - name: 覆盖 assets（换成新的自有产物）
        run: |
          set -e
          for name in reach_probe slide_probe perf_slide pc98260-su; do
            cp "$RUNNER_TEMP/out/$name" "app/src/main/assets/$name"
            chmod 755 "app/src/main/assets/$name"
            ls -l "app/src/main/assets/$name"
          done

      - name: 同步台账并自检
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, subprocess, datetime

          ledger_path = pathlib.Path("tools/assets-ledger.json")
          ledger = json.loads(ledger_path.read_text(encoding="utf-8"))
          sources = {
              "reach_probe": "plant/reach_probe.c",
              "slide_probe": "plant/slide_probe.c",
              "perf_slide": "plant/perf_slide.c",
              "pc98260-su": "plant/pc98260-su.c",
          }
          today = datetime.date.today().isoformat()
          for entry in ledger["assets"]:
              name = entry.get("name")
              if name not in sources:
                  continue
              path = pathlib.Path(entry["path"])
              data = path.read_bytes()
              blob = subprocess.check_output(["git", "hash-object", str(path)]).decode().strip()
              entry["size"] = len(data)
              entry["sha256"] = hashlib.sha256(data).hexdigest()
              entry["gitBlobSha1"] = blob
              entry["origin"] = "rebuilt-from-source"
              entry["sourceDraft"] = sources[name]
              entry["status"] = "rebuilt"
              entry["action"] = today + " 由 " + sources[name] + " 交叉编译后替换"
          ledger["updatedAt"] = today
          ledger_path.write_text(json.dumps(ledger, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print("台账已更新")
          PY
          python3 tools/check_assets.py --strict

      - name: 提交
        run: |
          set -e
          git config user.name "lhasa-ci"
          git config user.email "lhasa-ci@users.noreply.github.com"
          git add -A app/src/main/assets plant/equiv plant/out tools/assets-ledger.json
          if git diff --cached --quiet; then
            echo "没有变化，跳过提交"
            exit 0
          fi
          git commit -m "feat(assets): 探针产物、基线与 base64 分发"
          git push

      - name: 失败时把日志写进 issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          body="$RUNNER_TEMP/publish-failure.md"
          {
            echo "commit: \`$GITHUB_SHA\`"
            echo
            echo '```text'
            ls -lR "$RUNNER_TEMP/out" 2>/dev/null || echo "（无产物）"
            echo '```'
            echo '```text'
            git status --short 2>/dev/null | head -20 || true
            echo '```'
          } > "$body"
          gh issue create --title "ci: publish 失败 ${GITHUB_SHA:0:8}" --body-file "$body" \
            --repo "${{ github.repository }}" || true

  scan:
    name: 常量扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 扫描内核立即数
        run: |
          python3 - <<'PY'
          import os, pathlib, re

          LO, HI = 0xffffff8000000000, 0xffffffff00000000
          BASE = pathlib.Path("app/src/main/assets")
          TARGETS = ["uaf_plant_replay", "perf_slide", "slide_probe", "pc98260-su", "reach_probe"]
          KEYWORDS = ("zombie", "leak", "selinux", "cred", "slide", "uid=0",
                      "holding", "perf", "ring", "pipe", "rootd", "cap")

          out = ["# payload 常量扫描", ""]
          for name in TARGETS:
              path = BASE / name
              if not path.exists():
                  out += ["## " + name, "", "资产不存在。", ""]
                  continue
              data = path.read_bytes()
              hits = {}
              for off in range(0, len(data) - 8, 4):
                  value = int.from_bytes(data[off:off + 8], "little")
                  if LO <= value < HI:
                      hits[value] = hits.get(value, 0) + 1
              rows = sorted(hits.items(), key=lambda kv: -kv[1])[:40]
              out += ["## " + name, "", "`" + str(len(data)) + "` bytes，立即数 " + str(len(hits)) + " 个。", ""]
              for value, count in rows:
                  out.append("| `0x" + format(value, "016x") + "` | " + str(count) + " |")
              out.append("")
              strings = [s.decode("ascii", "replace") for s in re.findall(rb"[ -~]{6,}", data)]
              marks = [s for s in strings if any(k in s.lower() for k in KEYWORDS)]
              if marks:
                  out += ["```text", *marks[:40], "```", ""]

          dest = pathlib.Path(os.environ["RUNNER_TEMP"]) / "analysis-report.md"
          dest.write_text("\n".join(out) + "\n")
          print("wrote", dest)
          PY

      - name: 上传扫描报告
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: payload-analysis
          path: ${{ runner.temp }}/analysis-report.md
          if-no-files-found: warn
          retention-days: 2
