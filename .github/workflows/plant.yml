name: plant

# plant/ 下的自有 C 源码：交叉编译 + 与预编译件的等价性验证。
#
# 只读：不改仓库内容；失败时用 issues 权限把编译/等价性日志写进 issue
# （MCP 侧读不到 Actions 日志，只有 issue 能被程序读到）。

on:
  push:
    branches: [ next ]
    paths:
      - 'plant/**'
      - 'app/src/main/assets/**'
      - 'tools/plant_build.sh'
      - 'tools/equiv.py'
      - '.github/workflows/plant.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  compile:
    name: 编译 + 等价性验证
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 资产台账
        run: python3 tools/check_assets.py

      - name: 安装 zig
        run: |
          set -e
          curl -fsSL https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz -o "$RUNNER_TEMP/zig.tar.xz"
          tar -xf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-linux-x86_64-0.13.0" >> "$GITHUB_PATH"

      - name: 编译 plant/*.c
        id: compile
        run: |
          set -uo pipefail
          shopt -s nullglob
          LOG="$RUNNER_TEMP/compile.log"
          : > "$LOG"
          files=(plant/*.c)
          mkdir -p "$RUNNER_TEMP/out"
          if [ ${#files[@]} -eq 0 ]; then
            echo "plant/ 下还没有源码。" | tee -a "$LOG"
            exit 0
          fi
          CFLAGS=(-target aarch64-linux-musl -O2 -static -s
                  -ffunction-sections -fdata-sections -Wl,--gc-sections
                  -fno-asynchronous-unwind-tables -fno-unwind-tables -pthread)
          status=0
          for src in "${files[@]}"; do
            out="$RUNNER_TEMP/out/$(basename "${src%.c}")"
            echo "== zig cc $src -> $out" | tee -a "$LOG"
            if zig cc "${CFLAGS[@]}" "$src" -o "$out" 2>&1 | tee -a "$LOG"; then
              ls -l "$out" | tee -a "$LOG"
            else
              echo "::error::编译失败 $src"
              status=1
            fi
          done
          exit $status

      - name: 等价性验证
        id: equiv
        if: always()
        run: |
          set -uo pipefail
          python3 tools/equiv.py check-dir "$RUNNER_TEMP/out" 2>&1 | tee "$RUNNER_TEMP/equiv.log"
          exit "${PIPESTATUS[0]}"

      - name: 导出字符串表
        if: always()
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/strings"
          for name in uaf_plant_replay reach_probe slide_probe perf_slide pc98260-su; do
            src="app/src/main/assets/$name"
            [ -f "$src" ] && strings -n 4 "$src" | sort -u > "$RUNNER_TEMP/strings/$name.orig.txt"
            [ -f "$RUNNER_TEMP/out/$name" ] && \
              strings -n 4 "$RUNNER_TEMP/out/$name" | sort -u > "$RUNNER_TEMP/strings/$name.rebuilt.txt"
          done
          wc -l "$RUNNER_TEMP"/strings/*.txt || true

      - name: 上传产物
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: plant-binaries
          path: |
            ${{ runner.temp }}/out/*
            ${{ runner.temp }}/equiv.log
            ${{ runner.temp }}/compile.log
            ${{ runner.temp }}/strings/*.txt
          if-no-files-found: ignore
          retention-days: 2

      - name: 失败时把日志写进 issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          OUT_COMPILE: ${{ steps.compile.outcome }}
          OUT_EQUIV: ${{ steps.equiv.outcome }}
        run: |
          set -uo pipefail
          body="$RUNNER_TEMP/plant-failure.md"
          {
            echo "commit: \`$GITHUB_SHA\`"
            echo
            echo "### 各步结果"
            echo '```text'
            echo "compile = ${OUT_COMPILE}"
            echo "equiv   = ${OUT_EQUIV}"
            echo '```'
            echo "### compile.log"
            echo '```text'
            tail -c 12000 "$RUNNER_TEMP/compile.log" 2>/dev/null || echo "（无）"
            echo '```'
            echo "### equiv.log"
            echo '```text'
            tail -c 12000 "$RUNNER_TEMP/equiv.log" 2>/dev/null || echo "（无）"
            echo '```'
          } > "$body"
          gh issue create --title "ci: plant 失败 ${GITHUB_SHA:0:8}" --body-file "$body" \
            --repo "${{ github.repository }}" || true

  baseline:
    name: 生成等价性基线（需人工提交）
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 从现有预编译件提取基线
        run: python3 tools/equiv.py baseline --out "$RUNNER_TEMP/baseline"

      - name: 上传基线
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: plant-baselines
          path: ${{ runner.temp }}/baseline
          if-no-files-found: error
          retention-days: 2

  scan:
    name: 现有 payload 常量扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 扫描 64 位内核立即数与日志标记
        run: |
          python3 - <<'PY'
          import collections, pathlib, re, os

          KNOWN = {
              0xffffffc08042aa68: "profile timer (alloc_posix_timer+0x30)",
              0xffffffc08026c02c: "profile cred (prepare_creds+0x2c)",
              0xffffffc082959630: "profile selinux",
              0xffffffc0826d10d8: "profile userns",
              0xffffffc0826d1388: "profile rootuser",
              0xffffffc0826d2a48: "profile groups",
              0xffffffc0826d2f08: "profile ucounts",
              0xffffffc0801f2ec8: "profile task_site (copy_process+0x138)",
          }
          LO, HI = 0xffffff8000000000, 0xffffffff00000000
          BASE = pathlib.Path("app/src/main/assets")
          TARGETS = ["uaf_plant_replay", "perf_slide", "slide_probe", "pc98260-su", "reach_probe"]
          KEYWORDS = ("zombie", "leak", "selinux", "cred", "slide", "uid=0",
                      "holding", "perf", "ring", "pipe", "rootd", "cap")

          out = ["# payload 常量扫描", "",
                 "由 CI 从 `app/src/main/assets/` 的二进制直接扫描得出，未执行任何代码。", ""]

          for name in TARGETS:
              path = BASE / name
              if not path.exists():
                  out += [f"## {name}", "", "资产不存在。", ""]
                  continue
              data = path.read_bytes()
              hits = collections.OrderedDict()
              for off in range(0, len(data) - 8, 4):
                  value = int.from_bytes(data[off:off + 8], "little")
                  if LO <= value < HI:
                      if value in hits:
                          hits[value][1] += 1
                      else:
                          hits[value] = [off, 1]

              rows = sorted(hits.items(), key=lambda kv: -kv[1][1])
              shown = rows[:220]
              out += [f"## {name}", "", f"`{len(data)}` bytes，内核地址立即数 `{len(hits)}` 个。", ""]
              if not hits:
                  out += ["无匹配（位置无关或运行时计算）。", ""]
              else:
                  out += ["| addr | off | hits | note |", "|---|---|---|---|"]
                  for value, (off, count) in shown:
                      out.append(f"| `0x{value:016x}` | `0x{off:x}` | {count} | {KNOWN.get(value, '')} |")
                  if len(rows) > len(shown):
                      out += ["", f"其余 {len(rows) - len(shown)} 项省略。"]
                  out.append("")

              strings = [s.decode("ascii", "replace") for s in re.findall(rb"[ -~]{6,}", data)]
              marks = [s for s in strings if any(k in s.lower() for k in KEYWORDS)]
              if marks:
                  out += ["日志标记 / 关键字：", "", "```text", *marks[:80], "```", ""]

          dest = pathlib.Path(os.environ["RUNNER_TEMP"]) / "analysis-report.md"
          dest.write_text("\n".join(out) + "\n")
          print(f"wrote {dest} ({len(out)} lines)")
          PY

      - name: 上传扫描报告
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: payload-analysis
          path: ${{ runner.temp }}/analysis-report.md
          if-no-files-found: warn
          retention-days: 2
